<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore BLACK & GREEN Berlin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial, sans-serif}
.header{background:#0d0d0d;border-bottom:2px solid #00ff88;padding:14px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{color:#00ff88;font-size:14px;letter-spacing:.3px}
.days{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#0a0a0a;border-bottom:1px solid #222}
.days::-webkit-scrollbar{display:none}
.day{min-width:82px;background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer}
.day.active{background:#00ff88;color:#000;font-weight:900;border-color:#00ff88}
.day small{display:block;font-size:10px;opacity:.8;text-transform:uppercase}
.day b{display:block;font-size:12px;margin-top:4px}
.filters{display:flex;gap:8px;padding:12px 10px;overflow-x:auto}
.f{background:#1a1a1a;border:1px solid #333;padding:8px 16px;border-radius:22px;font-size:13px;cursor:pointer;white-space:nowrap}
.f.active{background:#00ff88;color:#000;font-weight:800}
.search{padding:0 10px 12px}
.search input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;outline:none;font-size:14px}
.league{background:#151515;padding:10px 12px;font-weight:900;font-size:11px;letter-spacing:.6px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #222}
.league.top{background:#001a0f;border-left:4px solid #00ff88;color:#00ff88}
.league span:last-child{opacity:.5;font-size:10px}
.row{display:flex;align-items:center;padding:13px 10px;border-bottom:1px solid #151515;background:#0e0e0e;font-size:13px}
.row.live{background:#1a0f0f;border-left:3px solid #ff3b30}
.t{width:68px;color:#00ff88;font-weight:900;font-size:13px}
.t.live{color:#ff3b30;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.n{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.s{width:70px;text-align:right;font-weight:800;font-size:13px}
.info{padding:60px 20px;text-align:center;color:#666;line-height:1.6;font-size:14px}
.info small{color:#444;font-size:12px;display:block;margin-top:10px}
</style>
</head>
<body>
<div class="header"><h1>⚽ LiveScore — BLACK & GREEN • Europe/Berlin Time</h1></div>
<div class="days" id="days"></div>
<div class="filters">
  <div class="f active" data-f="all">All</div>
  <div class="f" data-f="live">🔴 Live</div>
  <div class="f" data-f="finished">Finished</div>
  <div class="f" data-f="scheduled">Scheduled</div>
</div>
<div class="search"><input id="q" placeholder="Search team, league, country..."></div>
<div id="list"><div class="info">Loading matches...<br><small>Using Europe/Berlin Time</small></div></div>

<script>
let All=[], curF='all', curISO='';

function buildDays(){
  const cont=document.getElementById('days');
  const base=new Date();
  let html='';
  const dates=[];
  for(let i=-2;i<=3;i++){ const d=new Date(base); d.setDate(base.getDate()+i); dates.push(d); }

  dates.forEach((d,i)=>{
    const iso=d.toISOString().split('T')[0];
    const diff=i-2;
    let tag='';
    if(diff===-1) tag='YESTERDAY';
    else if(diff===0) tag='TODAY';
    else if(diff===1) tag='TOMORROW';
    else tag=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
    const label=d.getDate()+' '+d.toLocaleDateString('en-US',{month:'short'});
    const active=diff===0?'active':'';
    if(diff===0) curISO=iso;
    html+=`<div class="day ${active}" data-iso="${iso}"><small>${tag}</small><b>${label}</b></div>`;
  });
  cont.innerHTML=html;
  cont.querySelectorAll('.day').forEach(el=>{
    el.addEventListener('click',()=>{
      cont.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));
      el.classList.add('active');
      curISO=el.dataset.iso;
      load();
    });
  });
}

async function load(){
  document.getElementById('list').innerHTML='<div class="info">Loading '+curISO+'...<br><small>Berlin Time</small></div>';
  try{
    const r=await fetch(`/api/matches?date=${curISO}`);
    const j=await r.json();
    All=j.response||[];
    if(All.length===0){
      // Show debug but with auto-fallback message
      let dbg=j.debug||[];
      if(Array.isArray(dbg)) dbg=dbg.map(d=>`${d.date}:${d.matches?.length||d.count||0}`).join(' | ');
      else dbg=JSON.stringify(dbg).slice(0,200);
      document.getElementById('list').innerHTML=`<div class="info">No matches for ${curISO}<br>Trying real today...<br><small>${dbg}</small><br><br><small>Tip: Your phone date is set to future (Oct). Set phone date to today for more games.</small></div>`;
      // Auto-retry with real today if server provided fallback
      if(j.requested && j.requested!==curISO){
        curISO=j.requested;
        All=j.response||[];
        if(All.length>0){ render(); return; }
      }
      return;
    }
    render();
  }catch(e){
    document.getElementById('list').innerHTML='<div class="info">Error: '+e.message+'</div>';
  }
}

function prioritySort(a,b){
  if(a.fixture.status.short==='LIVE' && b.fixture.status.short!=='LIVE') return -1;
  if(b.fixture.status.short==='LIVE' && a.fixture.status.short!=='LIVE') return 1;
  if(a.priority!==b.priority) return a.priority-b.priority;
  return a.fixture.berlinTime.localeCompare(b.fixture.berlinTime);
}

function render(){
  let filtered=All;
  if(curF==='live') filtered=All.filter(m=>m.fixture.status.short==='LIVE');
  if(curF==='finished') filtered=All.filter(m=>m.fixture.status.short==='FT');
  if(curF==='scheduled') filtered=All.filter(m=>m.fixture.status.short==='NS');

  const q=document.getElementById('q').value.toLowerCase().trim();
  if(q) filtered=filtered.filter(m=>
    (m.teams.home.name+' '+m.teams.away.name+' '+m.league.name+' '+m.league.country).toLowerCase().includes(q)
  );

  filtered.sort(prioritySort);

  // Group by Country + League (Country at top)
  const groups={};
  filtered.forEach(m=>{
    const country=(m.league.country||'World').toUpperCase();
    const lname=m.league.name;
    const key=`${country}: ${lname}`;
    if(!groups[key]) groups[key]={list:[], pri:m.priority, country};
    groups[key].list.push(m);
  });

  const leagueKeys=Object.keys(groups).sort((a,b)=>groups[a].pri-groups[b].pri);

  let html='';
  if(leagueKeys.length===0){
    html=`<div class="info">No matches found<br><small>Try All filter</small></div>`;
  }

  leagueKeys.forEach(key=>{
    const g=groups[key];
    const isTop=g.pri<=8;
    html+=
