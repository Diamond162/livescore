<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAMOND LIVESCORE</title>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial}
.header{background:#0d4d1a;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.ad1{background:#ffcc00;color:#000;padding:12px;text-align:center;margin:10px;border-radius:12px;font-weight:bold}
.ad2{background:#00e5ff;color:#000;padding:12px;text-align:center;margin:10px;border-radius:12px;font-weight:bold}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px}
.tab{background:#2a2a2a;padding:8px 16px;border-radius:20px;white-space:nowrap}
.tab.active{background:#ff2d2d}
.filters{display:flex;gap:8px;padding:10px}
.f{padding:8px 16px;border-radius:20px;background:#2a2a2a}
.f.active{background:white;color:black}
.match{background:#1a1a1a;margin:10px;padding:12px;border-radius:12px}
.league{color:#aaa;font-size:12px}
.teams{display:flex;justify-content:space-between;margin-top:8px}
.score{color:#00ff88;font-weight:bold}
.live{color:#ff2d2d;font-size:12px}
</style>
</head>
<body>
<div class="header">💎 DIAMOND LIVESCORE</div>
<div class="ad1">🔥 ADVERT 1 - CLICK TO BET / WHATSAPP</div>
<div class="ad2">💰 ADVERT 2 - YOUR AD HERE</div>
<div class="tabs"><div class="tab">Sat, Oct 10</div><div class="tab">Sun, Oct 11</div><div class="tab active">Today</div><div class="tab">Tue, Oct 14</div></div>
<div class="filters"><div class="f active">All Games</div><div class="f">🔴 LIVE</div><div class="f">Finished</div></div>
<div id="games"></div>
<script>
const matches = [
{league:"Premier League",home:"Man City",away:"Arsenal",h:2,a:1,time:"78'",status:"LIVE"},
{league:"La Liga",home:"Barcelona",away:"Real Madrid",h:1,a:1,time:"45'",status:"LIVE"},
{league:"Serie A",home:"Inter",away:"AC Milan",h:3,a:0,time:"FT",status:"FT"},
{league:"Bundesliga",home:"Bayern",away:"Dortmund",h:0,a:0,time:"20:00",status:"NS"},
{league:"Ligue 1",home:"PSG",away:"Lyon",h:2,a:2,time:"FT",status:"FT"}
];
function render(){
document.getElementById('games').innerHTML = matches.map(m=>`
<div class="match">
<div class="league">${m.league} • <span class="live">${m.status} ${m.time}</span></div>
<div class="teams"><span>${m.home}</span><span class="score">${m.h} - ${m.a}</span><span>${m.away}</span></div>
</div>`).join('');
}
render();
setInterval(()=>{matches[0].h = Math.floor(Math.random()*4); render()},5000);
</script>
</body>
</html>
