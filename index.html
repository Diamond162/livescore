<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIELKING LIVESCORE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a2a3a;color:#fff;font-family:Arial, sans-serif}
.header{background:#0f2f1f;padding:14px;text-align:center;font-weight:800;font-size:18px;letter-spacing:1px;border-bottom:2px solid #1a4a2f}
.advert1{background:#ffb700;color:#000;text-align:center;padding:10px;font-weight:800;font-size:14px;cursor:pointer}
.advert2{background:#00bfff;color:#000;text-align:center;padding:10px;font-weight:800;font-size:14px;cursor:pointer}
.tabs{display:flex;gap:8px;padding:10px;background:#1e3446;overflow:auto}
.tab{flex:1;text-align:center;padding:10px 5px;border-radius:10px;background:#2a4055;color:#00bfff;font-weight:700;font-size:14px;cursor:pointer;border:none}
.tab.active{background:#4ecdc4;color:#000}
.filters{display:flex;gap:8px;padding:10px;background:#1e3446;overflow:auto}
.fbtn{flex:1;padding:8px 5px;border-radius:8px;border:none;font-weight:700;font-size:13px;cursor:pointer}
.fbtn.all{background:#2a4055;color:#00bfff}
.fbtn.live{background:#2a1a1a;color:#ff3333}
.fbtn.fin{background:#4ecdc4;color:#000}
.fbtn.ref{background:#4ecdc4;color:#000}
.league-head{background:#2a3f50;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px;text-transform:uppercase}
.stand{border:1px solid #5a8a5a;color:#8fbc8f;padding:4px 12px;border-radius:20px;font-size:11px;background:transparent;cursor:pointer}
.match-row{background:#fff;color:#000;padding:12px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;font-size:14px}
.match-row:nth-child(even){background:#f5f5f5}
.time{color:#d32f2f;font-size:13px;min-width:45px;font-weight:600}
.teams{flex:1;text-align:center;font-weight:600}
.score-dash{color:#2e7d32;font-weight:800;min-width:15px;text-align:right}
.loading{padding:40px;text-align:center;color:#aaa;background:#1a2a3a}
</style>
</head>
<body>
<div class="header">⚽ NIELKING LIVESCORE</div>
<div class="advert1" onclick="window.open('https://wa.me/2340000000000','_blank')">🔥 ADVERT 1 - CLICK HERE TO ADVERTISE 🔥</div>
<div class="advert2" onclick="window.open('https://wa.me/2340000000000','_blank')">💰 ADVERT 2 - CLICK HERE - WhatsApp Us 💰</div>
<div class="tabs">
<button class="tab active" onclick="filterDate('today',this)">Today</button>
<button class="tab" onclick="filterDate('yesterday',this)">Yesterday</button>
<button class="tab" onclick="filterDate('tomorrow',this)">Tomorrow</button>
</div>
<div class="filters">
<button class="fbtn all" onclick="filterStatus('all',this)">All Games</button>
<button class="fbtn live" onclick="filterStatus('live',this)">LIVE</button>
<button class="fbtn fin active" onclick="filterStatus('finished',this)">Finished</button>
<button class="fbtn ref" onclick="location.reload()">↻ REFRESH</button>
</div>
<div id="list"><div class="loading">Loading matches... ⏳</div></div>
<script>
let allMatches=[];
let currentFilter='all';
function getName(t){ if(!t) return 'TBD'; if(typeof t==='string') return t; return t.name||t.shortName||t.team||'Team'; }
function getLeague(m){ return m.league?.name||m.competition?.name||m.league_name||m.league||'FOOTBALL'; }
function getTime(m){ return m.time||m.kickoff||m.start_time||m.status||'--:--'; }

async function load(){
  const box=document.getElementById('list');
  try{
    const r=await fetch('/api/matches');
    const j=await r.json();
    let ms=j.data?.matches||j.data||j.matches||[];
    if(!Array.isArray(ms)) ms=[ms];
    allMatches=ms;
    render(ms);
  }catch(e){ box.innerHTML=`<div class=loading>Error: ${e.message}<br>Check API Key in Vercel</div>`; }
}

function render(matches){
  const box=document.getElementById('list');
  if(!matches.length){ box.innerHTML='<div class=loading>No matches found for this filter</div>'; return; }
  // group by league
  const groups={};
  matches.forEach(m=>{
    const lg=getLeague(m).toUpperCase();
    if(!groups[lg]) groups[lg]=[];
    groups[lg].push(m);
  });
  let html='';
  for(const [league, games] of Object.entries(groups)){
    html+=`<div class="league-head"><span>${league}</span><button class="stand">Standings</button></div>`;
    games.forEach(m=>{
      const home=getName(m.home_team||m.homeTeam||m.home||m.teams?.home);
      const away=getName(m.away_team||m.awayTeam||m.away||m.teams?.away);
      const time=m.kickoff_time||m.time||m.start||'20:00';
      const tstr=typeof time==='string'?time.slice(11,16)||time:time;
      const hs=m.home_score??m.score?.home??'';
      const as=m.away_score??m.score?.away??'';
      const hasScore=hs!==''&&hs!=='-'&&hs!=null;
      html+=`<div class="match-row"><span class="time">${hasScore?`${hs}-${as}`: (tstr||'--:--')}</span><span class="teams">${home} - ${away}</span><span class="score-dash">${hasScore?'':''} -</span></div>`;
    });
  }
  box.innerHTML=html;
}

function filterStatus(type,btn){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(type==='all') render(allMatches);
  else if(type==='live') render(allMatches.filter(m=> (m.status||'').toLowerCase().includes('live')||(m.state||'').toLowerCase().includes('live')));
  else if(type==='finished') render(allMatches.filter(m=> (m.status||'').toLowerCase().includes('ft')||(m.status||'').toLowerCase().includes('finished')));
}
function filterDate(d,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  load();
}
load();
setInterval(load,60000);
</script>
</body>
</html>
