<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Livescore - Live Football Scores</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1115;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.header{background:#1a1d25;padding:15px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2e39}
.header h1{font-size:22px;color:#00d084}
.tabs{display:flex;gap:10px;padding:12px;overflow-x:auto;background:#1a1d25}
.tab{padding:8px 16px;border-radius:20px;background:#2a2e39;border:none;color:#aaa;white-space:nowrap}
.tab.active{background:#00d084;color:#000;font-weight:700}
.match{background:#1a1d25;margin:8px;border-radius:10px;padding:12px;border-left:3px solid #2a2e39}
.match.live{border-left-color:#ff3b30}
.league{font-size:11px;color:#888;text-transform:uppercase;margin-bottom:6px}
.teams{display:flex;justify-content:space-between;align-items:center}
.team{display:flex;align-items:center;gap:8px;font-size:15px}
.score{font-weight:800;font-size:18px;background:#0f1115;padding:4px 10px;border-radius:6px}
.status{font-size:11px;margin-top:6px}
.status.live{color:#ff3b30;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.5}}
.loading{text-align:center;padding:50px;color:#888}
</style>
</head>
