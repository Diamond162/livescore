<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore BLACK & GREEN Berlin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
.header{background:#00FF88;color:#000;text-align:center;padding:14px;font-weight:900;font-size:18px;position:sticky;top:0;z-index:10}
.days{display:flex;overflow-x:auto;gap:8px;padding:10px;background:#111;border-bottom:1px solid #222}
.day{min-width:65px;border:1px solid #333;border-radius:10px;padding:8px 0;text-align:center;cursor:pointer;background:#1a1a1a}
.day.active{background:#00FF88;color:#000;font-weight:900}
.day small{display:block;font-size:10px;opacity:.7;text-transform:uppercase}
.tabs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.tab{border:1px solid #333;padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.active{background:#00FF88;color:#000;font-weight:700}
.search{padding:10px}
.search input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}
.league{background:#111;padding:10px 14px;font-weight:900;font-size:12px;color:#00FF88;border-top:1px solid #222;text-transform:uppercase}
.match{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #151515;background:#0f0f0f}
.match.live{border-left:4px solid #00FF88}
.time{color:#00FF88;font-weight:900;font-size:13px;min-width:50px}
.teams{flex:1;margin:0 10px}
.teams div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-weight:900;color:#00FF88;min-width:45px;text-align:right}
.status{font-size:11px;color:#aaa}
.live-dot{color:#00FF88;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="header">⚽ LiveScore - BLACK & GREEN - Europe/Berlin Time</div>
<div class="days" id="days"></div>
<div class="tabs">
 <div class="tab active" data-f="All">All</div>
 <div class="tab" data-f="Live">🔴 Live</div>
 <div class="tab" data-f="Scheduled">Scheduled</div>
 <div class="tab" data-f="Finished">Finished</div>
</div>
<div class="search"><input id="q" placeholder="Search team, league, country..."></div>
<div id="list">Loading matches...</div>

<script>
let ALL=[],curF='All',curDS='';

function buildDays(){
 const cont=document.getElementById('days');
 let h='';
 const today=new Date();
 for(let i=-1;i<6;i++){
  const d=new Date(today); d.setDate(today.getDate()+i);
  const ds=d.toISOString().split('T')[0];
  const diff=i;
  let tag=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
  if(diff===-1) tag='YESTERDAY';
  else if(diff===0) tag='TODAY';
  else if(diff===1) tag='TOMORROW';
  const label=d.toLocaleDateString('en-US',{day:'2-digit',month:'short'});
  const active=i===0?' active':'';
  h+=`<div class="day${active}" data-ds="${ds}"><small>${tag}</small><b>${label}</b></div>`;
 }
 cont.innerHTML=h;
 curDS=today.toISOString().split('T')[0];
 document.querySelectorAll('.day').forEach(el=>{
  el.addEventListener('click',()=>{
   document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));
   el.classList.add('active');
   curDS=el.dataset.ds;
   load();
  });
 });
}

async function load(){
 const list=document.getElementById('list');
 list.innerHTML='Loading matches...';
 try{
  const url=`/api/matches?date=${curDS}`;
  const res=await fetch(url);
  const data=await res.json();
  ALL=data.response||[];
  // If API searched 7 days, show info
  if(data.usedDates) console.log('Used dates:',data.usedDates);
  render();
 }catch(e){
  list.innerHTML='Error: '+e.message;
 }
}

function render(){
 const q=document.getElementById('q').value.toLowerCase();
 let filtered=ALL.filter(m=>{
  if(curF==='Live' && m.fixture.status.short!=='LIVE') return false;
  if(curF==='Scheduled' && m.fixture.status.short!=='NS') return false;
  if(curF==='Finished' &&!['FT','AET','PEN'].includes(m.fixture.status.short)) return false;
  if(q){
   const txt=(m.teams.home.name+' '+m.teams.away.name+' '+m.league.name+' '+m.league.country).toLowerCase();
   if(!txt.includes(q)) return false;
  }
  return true;
 });

 if(filtered.length===0){
  document.getElementById('list').innerHTML=`<div style="padding:20px;text-align:center;color:#666">No matches for ${curDS}<br><small>API found ${ALL.length} in next 7 days</small></div>`;
  return;
 }

 // Group by country + league
 let html=''; let lastLeague='';
 filtered.forEach(m=>{
  const leagueKey=`${m.league.country}: ${m.league.name}`;
  if(leagueKey!==lastLeague){
   html+=`<div class="league">${m.league.country.toUpperCase()}: ${m.league.name}</div>`;
   lastLeague=leagueKey;
  }
  const liveClass=m.fixture.status.short==='LIVE'?' live':'';
  const time=m.fixture.berlinTime||'00:00';
  const home=m.teams.home.name;
  const away=m.teams.away.name;
  const hs=m.goals.home, as=m.goals.away;
  const score=(hs!==null&&as!==null)?`${hs} - ${as}`:m.fixture.status.short;
  const statusDot=m.fixture.status.short==='LIVE'?'<span class="live-dot">● LIVE</span>':`<span class="status">${m.fixture.status.short} - Berlin ${time}</span>`;
  html+=`<div class="match${liveClass}">
   <div class="time">${time}<br>${statusDot}</div>
   <div class="teams"><div>${home}</div><div>${away}</div></div>
   <div class="score">${score}</div>
  </div>`;
 });
 document.getElementById('list').innerHTML=html;
}

document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('.tab').forEach(t=>{
 t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  curF=t.dataset.f;
  render();
 });
});

buildDays();
load();
</script>
</body>
</html>
