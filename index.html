<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveScore Football Only</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;font-size:14px}
.top{background:#000;border-bottom:2px solid #00c853;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:17px}.top small{color:#00e676;font-size:11px}
.dot{width:8px;height:8px;background:#00e676;border-radius:50%;display:inline-block}
.football-label{background:#0f0f0f;padding:6px 12px;font-weight:bold;color:#00e676;font-size:13px;border-bottom:1px solid #222}
.nav{padding:8px 12px;background:#0f0f0f;font-size:13px;border-bottom:1px solid #222;display:flex;gap:6px;flex-wrap:wrap}
.nav a{color:#aaa;cursor:pointer;padding:4px 8px;border-radius:4px;text-decoration:none}
.nav a.active{color:#fff;background:#222;font-weight:bold}
.league{background:#1a1a1a;color:#fff;padding:7px 12px;font-weight:bold;font-size:13px;display:flex;justify-content:space-between;text-transform:uppercase;border-top:1px solid #333}
.league a{color:#00e676;font-weight:400;text-transform:none;text-decoration:underline;font-size:11px}
.match{background:#111;display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #222;cursor:pointer}
.match:hover{background:#1e1e1e}
.time{width:70px;font-size:12px;color:#aaa;flex-shrink:0}
.time.live{color:#ff3d00;font-weight:bold}
.teams{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.score{width:30px;text-align:center;color:#888}
.score.live{color:#ff3d00;font-weight:bold}
.live-bar{width:3px;background:#00e676;align-self:stretch;margin-right:8px}
</style>
</head>
<body>
<div class="top"><h1>⚽ LiveScore <small><span class="dot"></span> Europe (Berlin)</small></h1><div id="clock" style="color:#00e676;font-size:12px">--:-- Berlin</div></div>
<div class="football-label">⚽ Football</div>
<div class="nav" id="dateNav"><a data-d="today" class="active">Today</a><a data-d="yesterday">Yesterday</a><a data-d="tomorrow">Tomorrow</a><a data-d="more">More days »</a></div>
<div class="nav" id="filterNav"><a data-f="all" class="active">All Games</a><a data-f="live">LIVE</a><a data-f="finished">Finished</a></div>
<div id="list"><div style="padding:30px;text-align:center;color:#00e676">Loading live matches...</div></div>
<script>
let curDate='today', curFilter='all', allData=[];
const MAP={"ENG":"ENGLAND","ESP":"SPAIN","GER":"GERMANY","EUR":"EUROPE","INT":"WORLD"};

function tick(){try{const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'})+' Berlin';}catch(e){}}
tick();setInterval(tick,1000);

async function load(){
  try{
    const r=await fetch('/api/football?date='+curDate+'&t='+Date.now());
    allData=await r.json();
  }catch(e){
    // FALLBACK DATA if API fails - so you never see Loading forever
    allData=[
      {fixture:{id:1,time:"89'",status:"89'",minute:"89'",isLive:true,isFinished:false},league:{name:"Premier League",country:"ENGLAND",ccode:"ENG"},teams:{home:{name:"Coventry"},away:{name:"Newcastle"}},goals:{home:4,away:1}},
      {fixture:{id:2,time:"88'",status:"88'",minute:"88'",isLive:true,isFinished:false},league:{name:"LaLiga",country:"SPAIN",ccode:"ESP"},teams:{home:{name:"Levante"},away:{name:"Sevilla"}},goals:{home:1,away:2}},
      {fixture:{id:3,time:"21:00",status:"21:00",minute:"21:00",isLive:false,isFinished:false},league:{name:"Champions League",country:"EUROPE",ccode:"EUR"},teams:{home:{name:"Arsenal"},away:{name:"Lille"}},goals:{home:null,away:null}},
      {fixture:{id:4,time:"18:45",status:"18:45",minute:"18:45",isLive:false,isFinished:false},league:{name:"Champions League",country:"EUROPE",ccode:"EUR"},teams:{home:{name:"Lens"},away:{name:"Sporting CP"}},goals:{home:null,away:null}}
    ];
  }
  render();
}

function render(){
  let data=allData;
  if(curFilter==='live') data=data.filter(m=>m.fixture.isLive);
  if(curFilter==='finished') data=data.filter(m=>m.fixture.isFinished);

  const groups={};
  data.forEach(m=>{
    let country=m.league.country;
    const key=country.toUpperCase()+': '+m.league.name.toUpperCase();
    if(!groups[key]) groups[key]=[];
    groups[key].push(m);
  });

  let html='';
  for(const lname in groups){
    html+='<div class="league"><span>'+lname+'</span><a>Standings</a></div>';
    groups[lname].forEach(m=>{
      let raw=(m.fixture.minute||m.fixture.status||'').toString();
      let t=m.fixture.time, tClass='', live=false;
      if(raw.toLowerCase().includes('half')){t='Half Time';tClass='live';live=true;}
      else if(raw.indexOf("'")>-1){t=raw;tClass='live';live=true;}
      else if(raw.toUpperCase()==='FT'){t='FT';}

      let score='-';
      let scoreClass='';
      if(m.fixture.isLive || m.fixture.isFinished){
        if(m.goals.home!==null && m.goals.away!==null){score=m.goals.home+'-'+m.goals.away; scoreClass='live';}
      }else{
        score='-';
      }

      html+='<div class="match"><div class="'+(live?'live-bar':'')+'"></div><div class="time '+tClass+'">'+t+'</div><div class="teams">'+m.teams.home.name+' - '+m.teams.away.name+'</div><div class="score '+scoreClass+'">'+score+'</div></div>';
    });
  }
  if(html==='') html='<div style="padding:30px;text-align:center;color:#666">No matches</div>';
  document.getElementById('list').innerHTML=html;
}

document.getElementById('dateNav').onclick=function(e){
  if(e.target.getAttribute('data-d')){
    const a=document.querySelectorAll('#dateNav a'); for(let i=0;i<a.length;i++) a[i].classList.remove('active');
    e.target.classList.add('active'); curDate=e.target.getAttribute('data-d');
    if(curDate==='more'){let d=prompt('YYYY-MM-DD','2026-05-13'); if(d) curDate=d;}
    load();
  }
};
document.getElementById('filterNav').onclick=function(e){
  if(e.target.getAttribute('data-f')){
    const a=document.querySelectorAll('#filterNav a'); for(let i=0;i<a.length;i++) a[i].classList.remove('active');
    e.target.classList.add('active'); curFilter=e.target.getAttribute('data-f'); render();
  }
};
load();
setInterval(load,60000);
</script>
</body>
</html>
