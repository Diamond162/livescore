<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashScore Lagos</title><style>*{margin:0;box-sizing:border-box}body{background:#0a0e1a;color:#fff;font-family:sans-serif}header{background:#111827;padding:16px;text-align:center;border-bottom:3px solid #00ff88}h1{font-size:22px}h1 span{color:#00ff88}p{color:#9ca3af;font-size:12px;margin-top:4px}#dates{display:flex;gap:8px;padding:10px;overflow:auto;background:#0f172a}.d{padding:8px 16px;background:#1e293b;border-radius:20px;white-space:nowrap;cursor:pointer;font-size:13px}.d.on{background:#00ff88;color:#000;font-weight:700}#tabs{display:flex;background:#111827}.t{flex:1;padding:12px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;border-bottom:2px solid transparent}.t.on{border-color:#00ff88;color:#00ff88}.lg{color:#9ca3af;font-size:11px;margin:16px 12px 6px}.m{background:#111827;margin:0 8px 8px;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid #00ff88}.tm{font-size:10px;color:#00ff88;margin-top:4px}.sc{font-size:20px;font-weight:900;color:#00ff88}</style></head><body><header><h1>⚽ FlashScore <span>Lagos</span></h1><p>LIVE • Black Green Pro • WAT</p></header><div id="dates"></div><div id="tabs"><div class="t on" data-f="ALL">ALL</div><div class="t" data-f="LIVE">LIVE</div><div class="t" data-f="FINISHED">FINISHED</div><div class="t" data-f="UPCOMING">UPCOMING</div></div><div id="list"></div><script>const demo=[{lg:"Premier League",h:"Arsenal",a:"Man City",hs:2,as:1,st:"LIVE",tm:"67'"},{lg:"Premier League",h:"Chelsea",a:"Liverpool",hs:1,as:1,st:"LIVE",tm:"52'"},{lg:"La Liga",h:"Real Madrid",a:"Barcelona",hs:2,as:2,st:"FINISHED",tm:"FT"},{lg:"Serie A",h:"Inter",a:"AC Milan",hs:0,as:0,st:"UPCOMING",tm:"20:45"},{lg:"NPFL - Nigeria",h:"Enyimba FC",a:"Remo Stars",hs:1,as:0,st:"LIVE",tm:"34'"},{lg:"Bundesliga",h:"Bayern Munich",a:"Dortmund",hs:3,as:2,st:"FINISHED",tm:"FT"},{lg:"NPFL - Nigeria",h:"Rangers Int'l",a:"Kano Pillars",hs:0,as:0,st:"UPCOMING",tm:"16:00"}];const datesEl=document.getElementById('dates'),listEl=document.getElementById('list');let cur=new Date().toISOString().split('T')[0],filter="ALL";for(let i=-3;i<=3;i++){let d=new Date();d.setDate(d.getDate()+i);let iso=d.toISOString().split('T')[0],txt=d.toLocaleDateString('en',{month:'short',day:'numeric'});if(i==0)txt="TODAY "+txt;let el=document.createElement('div');el.className='d'+(iso==cur?' on':'');el.textContent=txt;el.onclick=()=>{cur=iso;document.querySelectorAll('.d').forEach(x=>x.classList.remove('on'));el.classList.add('on');render();};datesEl.appendChild(el);}function render(){listEl.innerHTML='';let f=demo.filter(m=>filter=="ALL"||m.st==filter);if(!f.length){listEl.innerHTML='<div style="text-align:center;padding:40px;color:#666">No matches</div>';return;}let by={};f.forEach(m=>(by[m.lg]=by[m.lg]||[]).push(m));for(let lg in by){let h=document.createElement('div');h.className='lg';h.textContent=lg;listEl.appendChild(h);by[lg].forEach(m=>{let div=document.createElement('div');div.className='m';div.innerHTML=`<div><div>${m.h}</div><div style="color:#94a3b8">${m.a}</div><div class=tm>${m.tm} • ${m.st}</div></div><div class=sc>${m.hs} - ${m.as}</div>`;listEl.appendChild(div);});}}render();document.querySelectorAll('.t').forEach(t=>t.onclick=()=>{document.querySelectorAll('.t').forEach(x=>x.classList.remove('on'));t.classList.add('on');filter=t.dataset.f;render();});</script></body></html>
