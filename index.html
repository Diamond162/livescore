<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore BLACK & GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.header{background:#00ff88;color:#000;padding:15px;text-align:center;font-weight:bold}
.dates{display:flex;gap:8px;padding:10px;background:#111;overflow:auto}
.dates button{background:#222;color:#fff;border:none;padding:10px;border-radius:8px}
.dates button.active{background:#00ff88;color:#000}
.match{background:#111;margin:10px;padding:12px;border-left:4px solid #00ff88;border-radius:8px}
.time{color:#00ff88;font-weight:bold}
</style>
</head>
<body>
<div class="header">⚽ LiveScore BLACK & GREEN - Europe/Berlin</div>
<div class="dates" id="dates"></div>
<div id="list" style="padding:20px;text-align:center">Loading...</div>
<script>
let sel=new Date().toISOString().split('T')[0];
function makeDates(){
 const c=document.getElementById('dates');c.innerHTML='';
 for(let i=-1;i<=4;i++){
  let d=new Date();d.setDate(d.getDate()+i);
  let iso=d.toISOString().split('T')[0];
  let lbl=i==-1?'YESTERDAY':i==0?'TODAY':i==1?'TOMORROW':d.toLocaleDateString('en-US',{weekday:'short'});
  let b=document.createElement('button');b.textContent=lbl+' '+iso;
  if(iso==sel)b.classList.add('active');
  b.onclick=()=>{sel=iso;document.querySelectorAll('.dates button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load();};
  c.appendChild(b);
 }
}
async function load(){
 document.getElementById('list').innerHTML='Loading '+sel+'...';
 try{
  let r=await fetch('/api/matches?date='+sel);
  let j=await r.json();
  let list=j.response||[];
  if(!list.length){document.getElementById('list').innerHTML='No matches '+sel;return;}
  document.getElementById('list').innerHTML=list.map(m=>`<div class="match"><div style="color:#888;font-size:12px">${m.league.country} - ${m.league.name}</div><div style="display:flex;justify-content:space-between"><div>${m.teams.home.name}<br>${m.teams.away.name}</div><div><div class="time">${m.fixture.berlinTime}</div><div>${m.goals.home??''}-${m.goals.away??''} ${m.fixture.status.short}</div></div></div></div>`).join('');
 }catch(e){document.getElementById('list').innerHTML='API Error';}
}
makeDates();load();
</script>
</body>
</html>
