<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore - Live Matches</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
.header{background:#000;padding:12px;text-align:center;font-weight:bold;font-size:20px}
.match{background:#222;margin:8px;padding:12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.league{color:#888;font-size:12px;margin-bottom:4px}
.team{font-size:14px}
.score{font-weight:bold;color:#0f0;font-size:16px}
.live{color:red;font-weight:bold;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.5}}
</style>
</head>
<body>
<div class="header">⚽ LiveScore - Live Matches</div>
<div id="games">Loading matches...</div>
<script>
async function load(){
 const d=new Date().toISOString().split('T')[0];
 try{
  const res=await fetch(`/api/football?date=${d}`);
  const data=await res.json();
  const list=data.response||[];
  const box=document.getElementById('games');
  if(!list.length){
    box.innerHTML='<p style="text-align:center;margin-top:30px">No matches today</p>';
    return;
  }
  box.innerHTML=list.map(m=>{
    const status = m.fixture.status.short;
    const isLive = status==='LIVE';
    const home = m.teams.home.name;
    const away = m.teams.away.name;
    const league = m.league.name + ' - ' + m.league.country;
    const scoreHome = m.goals.home?? '-';
    const scoreAway = m.goals.away?? '-';
    return `
   <div class="match">
    <div>
     <div class="league">${league}</div>
     <div class="team">${home} vs ${away}</div>
    </div>
    <div style="text-align:right">
     <div class="${isLive?'live':'score'}">${status}</div>
     <div class="score">${scoreHome} - ${scoreAway}</div>
    </div>
   </div>`;
  }).join('');
 }catch(e){
   document.getElementById('games').innerHTML='Error: '+e.message;
 }
}
load();
setInterval(load,30000);
</script>
</body>
</html>
