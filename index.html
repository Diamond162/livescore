<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniel LiveScore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1115;color:#fff;font-family:Arial}
.header{background:#000;padding:14px;text-align:center;font-weight:900;font-size:22px;position:sticky;top:0;z-index:10}
.header span{color:#00ff88}
.dates{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#151821;position:sticky;top:52px;z-index:9}
.dates::-webkit-scrollbar{display:none}
.date-tab{padding:8px 16px;border-radius:20px;background:#222;color:#aaa;white-space:nowrap;cursor:pointer;font-size:13px;border:1px solid #333;min-width:90px;text-align:center}
.date-tab.active{background:#00ff88;color:#000;font-weight:bold}
.filters{display:flex;gap:8px;padding:10px;background:#0f1115}
.f-tab{padding:6px 14px;border-radius:6px;background:#1e222e;color:#888;cursor:pointer;font-size:13px;border:1px solid #2a2f42}
.f-tab.active{background:#fff;color:#000;font-weight:bold}
.refresh{margin-left:auto;background:#222;border:1px solid #333;color:#00ff88;padding:6px 12px;border-radius:6px}
.league-head{background:#1a1d27;padding:10px 12px;margin-top:14px;font-size:13px;font-weight:bold;color:#fff;display:flex;justify-content:space-between;border-left:3px solid #00ff88}
.match{background:#1e222e;border-bottom:1px solid #111;padding:12px;display:flex;align-items:center;gap:10px}
.time{width:55px;font-size:12px;color:#aaa;text-align:center;font-weight:bold;line-height:1.2}
.time b{display:block;color:#00ff88;font-size:14px}
.teams{flex:1}
.team{font-size:14px}
.vs{font-size:10px;color:#555;margin:3px 0}
.score{width:50px;text-align:right;font-weight:900;font-size:15px}
.score.live{color:#ff3b30}
</style>
</head>
<body>
<div class="header">⚽ <span>DANIEL</span> LiveScore</div>
<div class="dates" id="dateTabs"></div>
<div class="filters">
<div class="f-tab active" data-f="all" onclick="setFilter('all')">All</div>
<div class="f-tab" data-f="live" onclick="setFilter('live')">Live</div>
<div class="f-tab" data-f="ft" onclick="setFilter('ft')">Finished</div>
<button class="refresh" onclick="load()">↻</button>
</div>
<div id="games">Loading...</div>
<script>
let selectedDate=new Date().toISOString().split('T')[0];
let currentFilter='all';
let allMatches=[];
function fmt(d){return d.toISOString().split('T')[0]}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function buildDateTabs(){
 const today=new Date();
 const tabs=[{label:'Yesterday',date:fmt(addDays(today,-1))},{label:'Today',date:fmt(today)},{label:'Tomorrow',date:fmt(addDays(today,1))}];
 document.getElementById('dateTabs').innerHTML=tabs.map(t=>`<div class="date-tab ${t.date===selectedDate?'active':''}" onclick="pickDate('${t.date}')">${t.label}<br><small>${t.date.slice(5)}</small></div>`).join('')+`<div class="date-tab" onclick="document.getElementById('dp').showPicker()"><input type="date" id="dp" style="position:absolute;opacity:0;width:0" onchange="pickDate(this.value)">📅 More</div>`;
}
function pickDate(d){selectedDate=d;buildDateTabs();load();}
function setFilter(f){currentFilter=f;document.querySelectorAll('.f-tab').forEach(e=>e.classList.toggle('active',e.dataset.f===f));render();}

async function load(){
 document.getElementById('games').innerHTML='<p style="text-align:center;padding:30px">Loading '+selectedDate+'...</p>';
 try{
  const res=await fetch(`/api/football?date=${selectedDate}`);
  const data=await res.json();
  allMatches=data.response||[];
  render();
 }catch(e){document.getElementById('games').innerHTML='Error '+e.message}
}

function getTime(iso){
 if(!iso) return '--:--';
 try{
  // Support both 2025-10-12T14:00:00+00:00 and unix timestamp
  let d;
  if(!isNaN(iso)) d=new Date(Number(iso)*1000);
  else d=new Date(iso);
  if(isNaN(d.getTime())){
    // Fallback: extract HH:MM directly
    if(String(iso).includes('T')) return String(iso).split('T')[1].substring(0,5);
    return '--:--';
  }
  // Lagos time WAT UTC+1
  return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Africa/Lagos'});
 }catch{return '--:--'}
}

function render(){
 let list=[...allMatches];
 if(currentFilter==='live') list=list.filter(m=>m.fixture.status.short==='LIVE');
 if(currentFilter==='ft') list=list.filter(m=>m.fixture.status.short==='FT');

 // Arrange leagues: top first + LIVE first
 const topLeagues=['England','Spain','Italy','Germany','France','Brazil','UEFA','Premier','La Liga','Champions','Serie'];
 list.sort((a,b)=>{
  const aTop=topLeagues.some(t=> (a.league.name+a.league.country).includes(t))?0:1;
  const bTop=topLeagues.some(t=> (b.league.name+b.league.country).includes(t))?0:1;
  if(aTop!==bTop) return aTop-bTop;
  if(a.fixture.status.short==='LIVE' && b.fixture.status.short!=='LIVE') return -1;
  if(b.fixture.status.short==='LIVE' && a.fixture.status.short!=='LIVE') return 1;
  return new Date(a.fixture.date)-new Date(b.fixture.date);
 });

 const box=document.getElementById('games');
 if(!list.length){box.innerHTML=`<p style="text-align:center;padding:30px">No games for ${selectedDate}<br><small>Check Yesterday/Tomorrow</small></p>`;return;}

 const groups={};
 list.forEach(m=>{
  const key=`${m.league.country} - ${m.league.name}`;
  if(!groups[key]) groups[key]=[];
  groups[key].push(m);
 });

 let html='';
 for(const key in groups){
  html+=`<div class="league-head"><span>🌍 ${key}</span><small>${groups[key].length}</small></div>`;
  groups[key].forEach(m=>{
   const time=getTime(m.fixture.date);
   const short=m.fixture.status.short;
   const gh=m.goals.home; const ga=m.goals.away;
   let scoreText='v';
   let cls='';
   if(short==='LIVE'){ scoreText=(gh??0)+' - '+(ga??0); cls='live'; }
   else if(short==='FT'){ scoreText=(gh??0)+' - '+(ga??0); }
   const left = short==='LIVE'? `<b>LIVE</b>${time}` : short==='FT'? `<b>FT</b>${time}` : `<b>${time}</b>`;
   html+=`<div class="match"><div class="time">${left}</div><div class="teams"><div class="team">${m.teams.home.name}</div><div class="vs">vs</div><div class="team">${m.teams.away.name}</div></div><div class="score ${cls}">${scoreText}</div></div>`;
  });
 }
 box.innerHTML=html;
}
buildDateTabs();
load();
setInterval(load,60000);
</script>
</body>
</html>
