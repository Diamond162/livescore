<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashScore Clone - Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;color:#000;font-family:Arial,sans-serif;font-size:13px}
.header{background:#001928;color:#fff;padding:6px 8px;display:flex;justify-content:space-between;align-items:center}
.header b{color:#fff;font-size:15px}
.nav{padding:5px 8px;background:#eee;font-size:12px}
.nav a{color:#004a80;text-decoration:none;margin-right:4px}.nav a.active{font-weight:bold;color:#000}
.nav2{padding:5px 8px;background:#fff;border-bottom:1px solid #ccc;font-size:12px}
.nav2 a{color:#004a80;margin-right:6px;text-decoration:none}.nav2 a.active{font-weight:bold;color:#000}
.greenbar{background:#006400;color:#fff;padding:5px 8px;font-weight:bold;font-size:13px;margin:5px 0}
.league{background:#000;color:#fff;padding:4px 8px;font-weight:bold;text-transform:uppercase;font-size:12px;display:flex;justify-content:space-between}
.league a{color:#fff;font-weight:400;text-transform:none;text-decoration:underline;font-size:11px}
.match{display:flex;align-items:center;padding:3px 8px;border-bottom:1px solid #ddd;background:#fff}
.match:nth-child(even){background:#f5f5f5}
.time{width:55px;font-size:12px;color:#666;flex-shrink:0}
.time.live{color:#cc0000;font-weight:bold}
.teams{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{width:40px;text-align:right;font-weight:bold;color:#cc0000;flex-shrink:0}
.score.finished{color:#000}
.top-football{padding:4px 8px;background:#e0e0e0;font-weight:bold}
.btn{padding:3px 6px;border:1px solid #999;background:#fff;cursor:pointer;font-size:12px;margin-right:4px}
</style>
</head>
<body>
<div class="header"><b>⚽ LiveScore</b><span style="color:#00e676;font-size:11px">• Europe (Berlin) • Auto 60s</span><span id="clock" style="font-size:11px">--:-- Berlin</span></div>
<div class="nav">
<a class="active">Football</a> | <a>Hockey</a> | <a>Tennis</a> | <a>Basketball</a> | <a>Handball</a> | <a>Volley</a> | <a>Baseball</a> |<br>
<a>Am. football</a> | <a>Rugby Union</a> | <a>More sports »</a>
</div>
<div class="nav2" id="dateNav">
<a data-d="today" class="active">Today</a> | <a data-d="yesterday">Yesterday</a> | <a data-d="tomorrow">Tomorrow</a> | <a data-d="more">More days »</a>
</div>
<div class="nav2" id="filterNav">
<a data-f="all" class="active">All Games</a> | <a data-f="live">LIVE</a> | <a data-f="finished">Finished</a> | <a>Odds</a>
</div>
<div style="padding:5px 8px"><a onclick="load()" style="color:#004a80;text-decoration:underline;cursor:pointer;font-size:12px">REFRESH NOW</a></div>
<div class="greenbar" id="crumb">Football » Today » All Games</div>
<div id="list">Loading...</div>

<script>
let currentDate='today'; let currentFilter='all'; let allData=[];
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Berlin'})+' Berlin';}
async function load(){
  document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';
  const r=await fetch(`/api/football?date=${currentDate}&t=`+Date.now());
  allData=await r.json();
  render();
}
function render(){
  let data=allData;
  if(currentFilter==='live') data=data.filter(m=>m.fixture.isLive);
  if(currentFilter==='finished') data=data.filter(m=>m.fixture.isFinished);

  // Group by full country + league like FlashScore
  const groups={};
  data.forEach(m=>{
    const key=`${m.league.country}: ${m.league.name}`;
    if(!groups[key]) groups[key]=[];
    groups[key].push(m);
  });

  let html='';
  for(const [lname,matches] of Object.entries(groups)){
    html+=`<div class="league"><span>${lname}</span><a>Standings</a></div>`;
    matches.forEach(m=>{
      let t=m.fixture.time;
      const raw=(m.fixture.minute||m.fixture.status||"").toString();
      if(raw.includes("'")||raw.toLowerCase().includes('half')){
        t=raw.includes('Half')?'Half Time':raw;
      }else if(raw.toUpperCase()==='FT'||m.fixture.isFinished){
        t='FT';
      }
      const isLive=t.includes("'")||t.toLowerCase().includes('half');
      const score=(m.goals.home!==null&&m.goals.away!==null)?`${m.goals.home}-${m.goals.away}`:'-';
      html+=`<div class="match"><div class="time ${isLive?'live':''}">${t}</div><div class="teams">${m.teams.home.name} - ${m.teams.away.name}</div><div class="score ${t==='FT'?'finished':''}">${score}</div></div>`;
    });
  }
  if(!html) html='<div style="padding:20px;text-align:center;color:#888">No matches for this filter</div>';
  document.getElementById('list').innerHTML=html;
  document.getElementById('crumb').textContent=`Football » ${currentDate.charAt(0).toUpperCase()+currentDate.slice(1)} » ${currentFilter==='all'?'All Games':currentFilter.toUpperCase()}`;
}
document.getElementById('dateNav').addEventListener('click',e=>{
  if(e.target.dataset.d){
    document.querySelectorAll('#dateNav a').forEach(a=>a.classList.remove('active'));
    e.target.classList.add('active');
    currentDate=e.target.dataset.d==='more'?prompt('Enter date YYYY-MM-DD','2026-05-12')||'today':e.target.dataset.d;
    load();
  }
});
document.getElementById('filterNav').addEventListener('click',e=>{
  if(e.target.dataset.f){
    document.querySelectorAll('#filterNav a').forEach(a=>a.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter=e.target.dataset.f;
    render();
  }
});
tick();load();setInterval(load,60000);setInterval(tick,1000);
</script>
</body>
</html>
