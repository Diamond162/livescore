<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore BLACK & GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.header{background:#000;color:#00FF88;padding:14px;text-align:center;font-weight:bold;font-size:18px;border-bottom:2px solid #00FF88}
.dates{display:flex;overflow-x:auto;padding:10px;background:#111;gap:8px}
.dates button{padding:8px 14px;border:1px solid #333;background:#222;color:#fff;border-radius:20px;white-space:nowrap}
.dates button.active{background:#00FF88;color:#000;font-weight:bold}
.match{background:#111;margin:8px;padding:12px;border-left:4px solid #00FF88;border-radius:6px}
.time{color:#00FF88;font-weight:bold;font-size:12px}
.league{color:#888;font-size:11px;margin:4px 0}
.teams{font-size:15px;margin-top:6px}
.score{color:#00FF88;float:right;font-weight:bold}
.live{color:#ff4444;font-size:11px}
</style>
</head>
<body>
<div class="header">LiveScore BLACK & GREEN - Europe/Berlin</div>
<div class="dates" id="dates"></div>
<div id="list" style="padding:10px;text-align:center">Loading...</div>
<script>
let sel=new Date().toISOString().split('T')[0];
function makeDates(){
const c=document.getElementById('dates');c.innerHTML='';
for(let i=-3;i<=3;i++){
let d=new Date();d.setDate(d.getDate()+i);
let iso=d.toISOString().split('T')[0];
let b=document.createElement('button');b.textContent=(i==0?'TODAY ':'' )+d.toLocaleDateString('en-US',{weekday:'short'})+' '+d.getDate();
if(iso==sel)b.classList.add('active');
b.onclick=()=>{document.querySelectorAll('.dates button').forEach(x=>x.classList.remove('active'));b.classList.add('active');sel=iso;load();};
c.appendChild(b);
}
}
async function load(){
document.getElementById('list').innerHTML='Loading '+sel+'...';
try{
let r=await fetch('/api/matches?date='+sel);let j=await r.json();let L=j.response||[];
if(!L.length){document.getElementById('list').innerHTML='<div style="color:#888;padding:20px">No matches '+sel+'<br><small>'+(j.error||'')+'</small></div>';return;}
document.getElementById('list').innerHTML=L.map(m=>`<div class="match"><div class="time">${m.fixture.berlinTime||''} <span class="live">${m.fixture.status.short!='NS'?m.fixture.status.short:''} ${m.fixture.minute||''}</span></div><div class="league">${m.league.name}</div><div class="teams">${m.teams.home.name} <span class="score">${m.goals.home??'-'} : ${m.goals.away??'-'}</span><br>${m.teams.away.name}</div></div>`).join('');
}catch(e){document.getElementById('list').innerHTML='API Error: '+e.message}
}
makeDates();load();
setInterval(load,30000);
</script>
</body>
</html>
