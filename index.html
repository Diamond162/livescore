<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveScore</title><style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:10px}h1{text-align:center;padding:15px;color:#22c55e} .match{background:#1a1a1a;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #333}</style></head><body><h1>⚽ LIVESCORE LIVE</h1><div id="box" style="text-align:center;padding:40px">Loading... ⏳</div><script>async function load(){try{let r=await fetch('/api/matches');let j=await r.json();let d=document.getElementById('box');if(!j.data||!j.data.length){d.innerHTML='No matches today. API says: '+(j.error||JSON.stringify(j).slice(0,200));return} d.innerHTML=j.data.map(m=>`<div class=match><b>${m.home_team||m.home} vs ${m.away_team||m.away}</b><br>${m.home_score||0} - ${m.away_score||0} <br><small>${m.league||''} - ${m.status||''}</small></div>`).join('')}catch(e){document.getElementById('box').innerHTML='Error: '+e.message}}load()</script></body></html>
