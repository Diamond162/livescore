<!DOCTYPE html><html><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LiveScore Football Only</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial,sans-serif;font-size:14px}.top{background:#000;border-bottom:2px solid #00c853;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.dot{width:8px;height:8px;background:#00c853;border-radius:50%;display:inline-block}.football-label{background:#0f0f0f;padding:8px 12px;font-weight:bold;color:#00c853}.nav{padding:8px 12px;background:#0f0f0f;font-size:13px}.nav a{color:#aaa;text-decoration:none;margin-right:14px}.nav a.active{color:#fff;background:#333;padding:4px 8px;border-radius:4px}.list a{color:#aaa;text-decoration:none}.league{background:#111;padding:8px 12px;font-weight:bold;font-size:13px;display:flex;justify-content:space-between}.match{background:#111;display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #222}.match:hover{background:#1e1e1e}.time{width:70px;font-size:12px;color:#aaa}.teams{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}.score{width:30px;text-align:center;font-weight:bold}.live{width:3px;background:#00c853;align-self:stretch;margin-right:8px}</style></head><body>
<div class="top"><h1>⚽ LiveScore <small><span class="dot"></span> Europe (Berlin)</small></h1><div id="clock"></div></div>
<div class="football-label">⚽ Football</div>
<div class="nav" id="dateNav"><a data-d="today" class="active">Today</a><a data-d="yesterday">Yesterday</a><a data-d="tomorrow">Tomorrow</a><a>More days »</a></div>
<div class="nav" id="filterNav"><a data-f="all" class="active">All Games</a><a data-f="live">LIVE</a><a data-f="finished">Finished</a></div>
<div id="list"><div style="padding:40px;text-align:center;color:#00c853">Loading live matches...</div></div>
<script>
let curDate='today',curFilter='all',allData=[];
const MAP={'ENGLAND':'ENG','SPAIN':'ESP','GERMANY':'GER','EUROPE':'EUR','INT':'INT','WORLD':'WORLD'};
function tick(){try{const D=document.getElementById('clock');D.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' Berlin';}catch(e){}}tick();setInterval(tick,1000);
async function load(){try{const res=await fetch('/api/football?date='+curDate+'&t='+Date.now());allData=await res.json();}catch(e){allData=[
{fixture:{id:1,time:"89'",status:"89'",minute:"89'",isLive:true,isFinished:false},league:{name:"INT: CHAMPIONS LEAGUE",country:"INT"},teams:{home:{name:"Lens"},away:{name:"Sporting CP"}},goals:{home:1,away:0},score:{home:1,away:0}},
{fixture:{id:3,time:"21:00",status:"21:00",minute:"21:00",isLive:false,isFinished:false},league:{name:"INT: CHAMPIONS LEAGUE",country:"INT"},teams:{home:{name:"Arsenal"},away:{name:"Lille"}},goals:{home:null,away:null},score:{home:null,away:null}}];}render();}
function normalize(m){
 // Handle real API-Football format
 if(m.fixture && m.fixture.status && typeof m.fixture.status==='object'){
   const st=m.fixture.status;
   const isLive=['1H','2H','HT','ET','BT','P','LIVE'].includes(st.short);
   const isFinished=['FT','AET','PEN'].includes(st.short);
   let t=st.short; if(st.elapsed) t=st.elapsed+"'"; if(st.short==='NS' && m.fixture.date) t=new Date(m.fixture.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
   return {league:m.league, teams:m.teams, time:t, isLive:isLive, isFinished:isFinished, home:m.goals.home, away:m.goals.away, raw:m};
 }
 return {league:m.league, teams:m.teams, time:m.fixture.time||m.fixture.status, isLive:!!m.fixture.isLive, isFinished:!!m.fixture.isFinished, home:(m.score?.home??m.goals?.home), away:(m.score?.away??m.goals?.away), raw:m};
}
function render(){
 const list=document.getElementById('list'); if(!allData || allData.length===0){list.innerHTML='<div style="padding:40px;text-align:center;color:#888">No matches for '+curDate+'</div>';return;}
 let filtered=allData.map(normalize).filter(x=>{if(curFilter==='live')return x.isLive; if(curFilter==='finished')return x.isFinished; return true;});
 if(filtered.length===0){list.innerHTML='<div style="padding:40px;text-align:center;color:#888">No '+curFilter+' matches</div>';return;}
 // group by league
 const groups={}; filtered.forEach(m=>{const k=(m.league.country?m.league.country+': ':'')+m.league.name; if(!groups[k])groups[k]=[]; groups[k].push(m);});
 let html=''; for(const leagueName in groups){
   html+='<div class="league"><span>'+leagueName+'</span><span style="color:#00c853;font-size:12px">Standings</span></div>';
   groups[leagueName].forEach(m=>{
     const liveBar=m.isLive?'<div class="live"></div>':'<div style="width:3px"></div>';
     const timeColor=m.isLive?'color:#00c853;font-weight:bold':'color:#aaa';
     const score=(m.home!=null && m.away!=null)?m.home+' - '+m.away:'-';
     const teams=(m.teams.home.name||m.teams.home)+' - '+(m.teams.away.name||m.teams.away);
     html+='<div class="match">'+liveBar+'<div class="time" style="'+timeColor+'">'+m.time+'</div><div class="teams">'+teams+'</div><div class="score" style="color:'+(m.isLive?'#f3d000':'')+'">'+score+'</div></div>';
   });
 }
 list.innerHTML=html;
}
document.getElementById('dateNav').onclick=e=>{if(e.target.dataset.d){curDate=e.target.dataset.d;document.querySelectorAll('#dateNav a').forEach(a=>a.classList.remove('active'));e.target.classList.add('active');load();}};
document.getElementById('filterNav').onclick=e=>{if(e.target.dataset.f){curFilter=e.target.dataset.f;document.querySelectorAll('#filterNav a').forEach(a=>a.classList.remove('active'));e.target.classList.add('active');render();}};
load();
</script></body></html>
