<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLASHCORE LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.header{background:#111;padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #00ff88}
.logo{font-size:22px;font-weight:900}
.logo span{color:#00ff88}
.dates{display:flex;overflow-x:auto;gap:6px;padding:10px;background:#111;border-bottom:1px solid #222}
.dates button{padding:6px 12px;border-radius:20px;border:1px solid #333;background:#222;color:#fff;font-size:12px;white-space:nowrap}
.dates button.active{background:#00ff88;color:#000;font-weight:bold}
.tabs{display:flex;gap:6px;padding:8px;background:#111}
.tabs button{padding:6px 14px;border-radius:16px;background:#222;color:#fff;border:none;font-size:12px;font-weight:bold}
.tabs button.active{background:#00ff88;color:#000}
.league-head{background:#222;padding:8px 12px;font-size:12px;font-weight:bold;border-left:4px solid #00ff88;margin-top:8px}
.match{display:flex;padding:10px 12px;border-bottom:1px solid #1a1a1a;background:#0f0f0f}
.match:hover{background:#1a1a1a}
.time{width:50px;font-size:11px;color:#888}
.time.live{color:#ff4444;font-weight:bold}
.teams{flex:1;font-size:13px}
.score{font-weight:bold;color:#00ff88}
</style>
</head>
<body>
<div class="header">
<div class="logo">FLASH<span>CORE</span> <span style="font-size:10px;background:#00ff88;color:#000;padding:2px 6px;border-radius:4px">LIVE</span></div>
<div>⚙️</div>
</div>
<div class="dates" id="dates"></div>
<div class="tabs">
<button class="active">ALL</button><button>LIVE</button><button>FINISHED</button><button>SCHEDULED</button>
</div>
<div id="list" style="padding:20px;text-align:center;color:#666">Loading...</div>
<script>
let sel=new Date().toISOString().split('T')[0];
function makeDates(){
let c=document.getElementById('dates');c.innerHTML='';
for(let i=-3;i<=4;i++){
let d=new Date();d.setDate(d.getDate()+i);
let iso=d.toISOString().split('T')[0];
let label=(i==0?'TODAY ':'')+d.toLocaleDateString('en-US',{weekday:'short',day:'numeric'});
let b=document.createElement('button');
b.textContent=label;
if(iso==sel) b.classList.add('active');
b.onclick=()=>{document.querySelectorAll('.dates button').forEach(x=>x.classList.remove('active'));b.classList.add('active');sel=iso;load();};
c.appendChild(b);
}
}
async function load(){
let el=document.getElementById('list');
el.innerHTML='Loading '+sel+'...';
try{
let r=await fetch('/api/matches?date='+sel);
let j=await r.json();
if(j.error){el.innerHTML='API Error: '+j.error+'<br><small>Check FOOTBALL_API_KEY in Cloudflare</small>';return;}
let arr=j.response||[];
if(!arr.length){el.innerHTML='No matches on '+sel+'<br>Try yesterday: <button onclick="sel=\'2025-10-15\';load()" style="color:#00ff88">2025-10-15</button>';return;}
let groups={};
arr.forEach(m=>{let k=m.league.name;if(!groups[k])groups[k]=[];groups[k].push(m);});
let html='';
for(let league in groups){
html+='<div class="league-head">⚽ '+league+' ('+groups[league].length+')</div>';
groups[league].forEach(m=>{
let isLive=m.fixture.status.short!='NS' && m.goals.home!==null;
let t=m.fixture.berlinTime||'--:--';
let s=m.fixture.status.short;
html+='<div class="match"><div class="time '+(isLive?'live':'')+'">'+(isLive?s:t)+'</div><div class="teams">'+m.teams.home.name+'<br><span style="color:#888">'+m.teams.away.name+'</span></div><div class="score">'+(m.goals.home!=null?m.goals.home+' - '+m.goals.away:'- : -')+'</div></div>';
});
}
el.innerHTML=html;
}catch(e){el.innerHTML='Fetch error: '+e.message+'<br>API: /api/matches?date='+sel;}
}
makeDates();load();setInterval(load,30000);
</script>
</body>
</html>
