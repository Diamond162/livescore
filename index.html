<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}
header{background:#121212;padding:14px;text-align:center;font-size:22px;font-weight:800;border-bottom:2px solid #ffcc00;position:sticky;top:0;z-index:10}
.date-bar{display:flex;gap:8px;padding:10px;background:#111;overflow-x:auto;white-space:nowrap;position:sticky;top:55px;z-index:9;border-bottom:1px solid #222}
.date-bar button{padding:8px 16px;border-radius:20px;border:1px solid #333;background:#1e1e1e;color:#aaa;font-weight:600;cursor:pointer}
.date-bar button.active{background:#ffcc00;color:#000;border-color:#ffcc00}
.date-bar input{background:#1e1e1e;border:1px solid #333;color:#fff;padding:8px;border-radius:20px}
.filter-bar{display:flex;gap:8px;padding:10px;background:#0f0f0f;overflow-x:auto;border-bottom:1px solid #1a1a1a}
.filter-bar button{padding:7px 14px;border-radius:6px;border:0;background:#1e1e1e;color:#ccc;font-size:13px;font-weight:600}
.filter-bar button.active{background:#fff;color:#000}
#search{width:94%;margin:10px auto;display:block;padding:13px 15px;border-radius:10px;border:0;background:#1e1e1e;color:#fff;font-size:15px}
.league{background:#161616;padding:10px 12px;color:#ffcc00;font-weight:700;font-size:13px;text-transform:uppercase;display:flex;justify-content:space-between;border-left:4px solid #ffcc00;margin-top:8px}
.league span{color:#666;font-size:11px}
.match{display:flex;align-items:center;justify-content:space-between;padding:12px 12px;background:#121212;border-bottom:1px solid #1e1e1e}
.time{width:60px;font-size:13px;color:#aaa;line-height:1.2}
.time b{color:#fff;display:block;font-size:12px}
.teams{flex:1;margin:0 10px;font-size:14px;line-height:1.3}
.teams small{display:block;color:#777;font-size:11px}
.score{min-width:50px;text-align:right;font-weight:800}
.live{color:#ff3b3b;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.5}}
.top-badge{background:#ffcc00;color:#000;font-size:9px;padding:2px 5px;border-radius:3px;margin-left:6px;font-weight:800}
</style>
</head>
<body>
<header>⚽ LiveScore</header>

<div class="date-bar" id="dateBar">
<button data-d="today" class="active">Today</button>
<button data-d="yesterday">Yesterday</button>
<button data-d="tomorrow">Tomorrow</button>
<input type="date" id="moreDate">
</div>

<div class="filter-bar" id="filterBar">
<button data-f="all" class="active">All Games</button>
<button data-f="live">Live 🔴</button>
<button data-f="finished">Finished</button>
<button data-f="scheduled">Scheduled</button>
<button id="refreshBtn">↻ Refresh</button>
</div>

<input id="search" placeholder="🔍 Search team or league...">

<div id="app" style="padding-bottom:50px">Loading...</div>

<script>
let allMatches=[], currentDate='', currentFilter='all';
const TOP_LEAGUES=["Premier League","England - Premier League","La Liga","Spain - La Liga","UEFA Champions League","Champions League","Serie A - Italy","Serie A","Bundesliga","Ligue 1","Europa League","EPL"];

function fmtDate(d){return d.toISOString().split('T')[0];}
function getDateFor(type){
  const now=new Date(); if(type==='today') return fmtDate(now);
  if(type==='yesterday'){ const x=new Date(); x.setDate(x.getDate()-1); return fmtDate(x);}
  if(type==='tomorrow'){ const x=new Date(); x.setDate(x.getDate()+1); return fmtDate(x);}
  return type;
}
function getTime(f){
  try{
    let dt=new Date(f.date);
    if(isNaN(dt) && f.timestamp) dt=new Date(f.timestamp*1000);
    if(isNaN(dt)) return {t: f.status?.short || '--:--', live:false};
    const isLive = ['1H','2H','HT','ET','LIVE'].includes(f.status?.short);
    return {t: dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}), live:isLive, status:f.status?.short};
  }catch{return {t:'--:--', live:false};}
}
async function load(dateStr){
  currentDate=dateStr;
  document.getElementById('app').innerHTML='<p style="padding:30px;text-align:center;color:#777">Loading '+dateStr+'...</p>';
  try{
    const r=await fetch('/api/football?date='+dateStr);
    const j=await r.json();
    allMatches=j.response||[];
    render();
  }catch(e){
    document.getElementById('app').innerHTML='Error: '+e;
  }
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  let list=[...allMatches];
  if(currentFilter==='live') list=list.filter(m=>['1H','2H','HT','LIVE','ET','P'].includes(m.fixture.status.short));
  else if(currentFilter==='finished') list=list.filter(m=>['FT','AET','PEN'].includes(m.fixture.status.short));
  else if(currentFilter==='scheduled') list=list.filter(m=>['NS','TBD'].includes(m.fixture.status.short));
  if(q) list=list.filter(m=>(m.teams.home.name+' '+m.teams.away.name+' '+m.league.name+' '+m.league.country).toLowerCase().includes(q));

  // Sort: top leagues first, then by time
  list.sort((a,b)=>{
    const ai=TOP_LEAGUES.findIndex(x=>a.league.name.toLowerCase().includes(x.toLowerCase()));
    const bi=TOP_LEAGUES.findIndex(x=>b.league.name.toLowerCase().includes(x.toLowerCase()));
    const aTop=ai===-1?999:ai, bTop=bi===-1?999:bi;
    if(aTop!==bTop) return aTop-bTop;
    return (a.fixture.timestamp||0)-(b.fixture.timestamp||0);
  });

  const app=document.getElementById('app');
  if(!list.length){app.innerHTML='<p style="padding:30px;text-align:center">No matches for filter</p>';return;}

  let html='', lastLeague='';
  list.forEach(m=>{
    const leagueKey=m.league.name+' • '+m.league.country;
    if(leagueKey!==lastLeague){
      const isTop=TOP_LEAGUES.some(x=>m.league.name.toLowerCase().includes(x.toLowerCase()));
      html+=`<div class="league"><span>${leagueKey} ${isTop?'<span class="top-badge">TOP</span>':''}</span><span>${m.league.round||''}</span></div>`;
      lastLeague=leagueKey;
    }
    const {t,live,status}=getTime(m.fixture);
    const score = (m.goals.home!=null && m.goals.away!=null)? `${m.goals.home}:${m.goals.away}` : '-:-';
    const statusText = status==='NS'? t : (status==='FT'? 'FT' : status);
    html+=`<div class="match">
      <div class="time"><b class="${live?'live':''}">${live?'LIVE':statusText}</b>${t}</div>
      <div class="teams">${m.teams.home.name}<br>${m.teams.away.name}<small>${m.league.name}</small></div>
      <div class="score ${live?'live':''}">${score}</div>
    </div>`;
  });
  app.innerHTML=html;
}

// Events
document.getElementById('dateBar').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON') return;
  document.querySelectorAll('.date-bar button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  load(getDateFor(e.target.dataset.d));
});
document.getElementById('moreDate').addEventListener('change',e=>{
  if(!e.target.value) return;
  document.querySelectorAll('.date-bar button').forEach(b=>b.classList.remove('active'));
  load(e.target.value);
});
document.getElementById('filterBar').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON' || e.target.id==='refreshBtn') return;
  document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter=e.target.dataset.f;
  render();
});
document.getElementById('refreshBtn').addEventListener('click',()=>load(currentDate));
document.getElementById('search').addEventListener('input',render);

// Init Today
load(getDateFor('today'));
</script>
</body>
</html>
