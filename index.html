<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Diamond Livescore</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f1419;color:#fff;font-family:sans-serif}.header{padding:16px;text-align:center;background:#15202b;position:sticky;top:0;border-bottom:1px solid #1a2a3a}.header h1{font-size:22px;color:#1d9bf0}.container{max-width:600px;margin:0 auto;padding:12px}.league{background:#192734;border-radius:12px;margin-bottom:12px;border:1px solid #253341;overflow:hidden}.league-head{padding:10px 14px;background:#1e2f42;font-weight:700;font-size:13px;text-transform:uppercase}.match{padding:12px 14px;border-top:1px solid #253341;display:flex;justify-content:space-between;align-items:center}.team{display:flex;gap:8px;align-items:center;font-size:14px}.team img{width:20px;height:20px}.score{font-weight:800;background:#1d9bf0;padding:6px 10px;border-radius:8px;min-width:50px;text-align:center}.status{font-size:10px;color:#1d9bf0}</style>
</head>
<body>
<div class="header"><h1>DIAMOND LIVESCORE</h1><small id="count">Loading...</small></div>
<div class="container" id="app"><div style="text-align:center;padding:40px;color:#8899a6">Loading...</div></div>
<script>
async function load(){
  const app=document.getElementById('app'); const countEl=document.getElementById('count');
  try{
    const res=await fetch('/api/football'); const json=await res.json(); const matches=json.response||[];
    if(matches.length===0){app.innerHTML='<div style="text-align:center;padding:40px">No matches</div>';return;}
    countEl.textContent=`${matches.length} matches • Live`;
    const groups={}; matches.forEach(m=>{const lname=m.league?.name||'Football'; if(!groups[lname]) groups[lname]=[]; groups[lname].push(m);});
    let html=''; for(const [lname,list] of Object.entries(groups)){
      html+=`<div class="league"><div class="league-head">${lname}</div>`;
      list.forEach(m=>{
        const home=m.teams?.home?.name||'Home'; const away=m.teams?.away?.name||'Away';
        const hLogo=m.teams?.home?.logo?`<img src="${m.teams.home.logo}" onerror="this.style.display='none'">`:'';
        const aLogo=m.teams?.away?.logo?`<img src="${m.teams.away.logo}" onerror="this.style.display='none'">`:'';
        const hg=m.goals?.home??'-'; const ag=m.goals?.away??'-';
        let st=m.fixture?.status?.short; if(typeof st!=='string'){ st=st?.display||st?.short||'FT'; }
        const live=String(st).toUpperCase().includes('LIVE')||String(st).includes('H');
        html+=`<div class="match"><div><div class="team">${hLogo} ${home}</div><div class="team" style="margin-top:6px">${aLogo} ${away}</div></div><div style="text-align:center"><div class="score">${hg} - ${ag}</div><div style="font-size:11px;color:#8899a6;margin-top:4px">${live?'<span style="color:#1d9bf0">LIVE</span>':st}</div></div></div>`;
      }); html+=`</div>`;
    } app.innerHTML=html;
  }catch(e){app.innerHTML=`Error: ${e.message}`;}
}
load(); setInterval(load,60000);
</script>
</body>
</html>
