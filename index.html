<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore Top Leagues First</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:Arial}
.header{background:#111;border-bottom:3px solid #00ff88;padding:14px;text-align:center;position:sticky;top:0;z-index:20}
.header h1{color:#00ff88;font-size:18px}
.tabs{display:flex;gap:8px;justify-content:center;padding:12px;background:#0a0a0a;position:sticky;top:52px;z-index:10}
.tab{background:#222;border:1px solid #333;padding:8px 18px;border-radius:20px;cursor:pointer;color:#999;font-size:14px}
.tab.active{background:#00ff88;color:#000;font-weight:800}
.filters{display:flex;gap:6px;padding:0 10px 10px;overflow-x:auto}
.f{background:#1a1a1a;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
.f.active{background:#00ff88;color:#000}
.search{padding:0 10px 10px}
.search input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #333;background:#141414;color:#fff}
.league-header{background:#1e1e1e;border-top:1px solid #2a2a2a;border-bottom:1px solid #2a2a2a;padding:8px 10px;font-weight:800;font-size:12px;color:#fff;text-transform:uppercase;display:flex;justify-content:space-between}
.league-header.top{background:#002b15;border-left:4px solid #00ff88}
.league-header span{color:#00ff88;font-weight:400;text-transform:none;text-decoration:underline}
.match-row{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid #151515;font-size:14px;background:#0e0e0e}
.match-row.live{background:#1a1010}
.time{width:48px;color:#aaa;font-size:13px}
.time.live{color:#ff3b3b;font-weight:800}
.teams{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{width:50px;text-align:center;font-weight:800}
.score.live{color:#ff3b3b}
.info{padding:30px;text-align:center;color:#777}
</style>
</head>
<body>
<div class="header"><h1>⚽ LiveScore — BLACK & GREEN • Europe Time</h1></div>
<div class="tabs">
  <div class="tab" data-d="yesterday">Yesterday</div>
  <div class="tab active" data-d="today">Today</div>
  <div class="tab" data-d="tomorrow">Tomorrow</div>
</div>
<div class="filters">
  <div class="f active" data-f="all">All</div>
  <div class="f" data-f="live">🔴 Live</div>
  <div class="f" data-f="scheduled">Scheduled</div>
  <div class="f" data-f="finished">Finished</div>
</div>
<div class="search"><input id="q" placeholder="Search team, country or league..."></div>
<div id="list"><div class="info">Loading...</div></div>

<script>
let ALL=[];
let curF='all';

function getPriority(league){
  const name=(league.name+' '+league.country).toLowerCase();
  if(name.includes('europe')||name.includes('champions league')) return 1;
  if(name.includes('england')||name.includes('premier league')) return 2;
  if(name.includes('spain')||name.includes('la liga')) return 3;
  if(name.includes('germany')||name.includes('bundesliga')) return 4;
  if(name.includes('italy')||name.includes('serie a')) return 5;
  if(name.includes('france')||name.includes('ligue 1')) return 6;
  if(name.includes('europa league')||name.includes('conference')) return 7;
  if(name.includes('asia')&&name.includes('champions')) return 8;
  if(name.includes('argentina')||name.includes('brazil')) return 9;
  return 99;
}

function parseEuro(dateStr){
  try{
    let t=(dateStr||'').toString().trim().replace(' ','T');
    if(!t) return '00:00';
    if(!t.endsWith('Z')&&!t.includes('+')) t+='Z';
    const d=new Date(t);
    if(isNaN(d)){
      const m=t.match(/T(\d{2}):(\d{2})/);
      if(m) return m[1]+':'+m[2];
      return '00:00';
    }
    return d.toLocaleTimeString('en-GB',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit'});
  }catch{return '00:00';}
}

async function load(d){
  document.getElementById('list').innerHTML='<div class="info">Loading '+d+'...</div>';
  const r=await fetch('/api/matches?date='+d);
  const j=await r.json();
  ALL=j.response||[];
  if(ALL.length===0){
    document.getElementById('list').innerHTML=`<div class="info">No matches for ${j.date_used}<br>Credits: ${j.credits}</div>`;
    return;
  }
  render();
}

function render(){
  let list=[...ALL];
  const q=document.getElementById('q').value.toLowerCase();
  if(q) list=list.filter(m=> (m.teams.home.name+' '+m.teams.away.name+' '+m.league.name+' '+m.league.country).toLowerCase().includes(q));
  if(curF!=='all'){
    list=list.filter(m=>{
      const s=m.fixture.status.short;
      if(curF==='live') return s==='LIVE';
      if(curF==='finished') return s==='FT';
      if(curF==='scheduled') return s==='NS';
      return true;
    });
  }
  // SORT BY PRIORITY
  list.sort((a,b)=>{
    const pa=getPriority(a.league), pb=getPriority(b.league);
    if(pa!==pb) return pa-pb;
    return (a.league.country+a.league.name).localeCompare(b.league.country+b.league.name);
  });

  const groups={};
  const order=[];
  list.forEach(m=>{
    const key=`${(m.league.country||'WORLD').toUpperCase()}: ${m.league.name.toUpperCase()}`;
    if(!groups[key]){
      groups[key]=[];
      order.push(key);
    }
    groups[key].push(m);
  });

  let html='';
  order.forEach(key=>{
    const isTop=getPriority({name:key,country:key})<=8;
    html+=`<div class="league-header ${isTop?'top':''}">${key} <span>Standings</span></div>`;
    groups[key].forEach(m=>{
      const isLive=m.fixture.status.short==='LIVE';
      const isFT=m.fixture.status.short==='FT';
      const euro=parseEuro(m.fixture.date);
      const h=m.goals.home, a=m.goals.away;
      let score='-';
      if(h!=null && a!=null) score=`${h}-${a}`;
      let timeLabel=euro;
      if(isLive){
        timeLabel=m.fixture.status.long||euro;
        if(timeLabel.length>5 &&!timeLabel.includes("'")) timeLabel=euro;
      }
      html+=`<div class="match-row ${isLive?'live':''}">
        <div class="time ${isLive?'live':''}">${timeLabel}</div>
        <div class="teams">${m.teams.home.name} - ${m.teams.away.name}</div>
        <div class="score ${isLive?'live':''}">${score}</div>
      </div>`;
    });
  });
  document.getElementById('list').innerHTML=html||'<div class="info">No matches</div>';
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',e=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  e.target.classList.add('active');
  load(e.target.dataset.d);
}));
document.querySelectorAll('.f').forEach(f=>f.addEventListener('click',e=>{
  document.querySelectorAll('.f').forEach(x=>x.classList.remove('active'));
  e.target.classList.add('active');
  curF=e.target.dataset.f;
  render();
}));
document.getElementById('q').addEventListener('input',render);
load('today');
</script>
</body>
</html>
