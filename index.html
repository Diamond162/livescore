<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlashScore</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
h1{background:#000;color:#fff;padding:12px;text-align:center;margin:0;font-size:16px}
#dates{display:flex;gap:5px;padding:8px;background:#fff;overflow:auto}
#dates div{border:1px solid #ddd;padding:6px 10px;border-radius:4px;background:#fff;min-width:55px;text-align:center;cursor:pointer}
#dates div.on{border:2px solid #000;font-weight:bold}
#filters{display:flex;gap:5px;padding:8px;background:#fff}
#filters button{padding:5px 10px;border:1px solid #ddd;background:#fff;border-radius:4px}
#filters button.on{background:#000;color:#fff}
.league{background:#e0e0e0;padding:6px;font-size:11px}
.match{display:flex;justify-content:space-between;padding:10px;background:#fff;border-bottom:1px solid #eee}
.time{width:50px;font-weight:bold;text-align:center}
.teams{flex:1;padding:0 8px}
.score{width:40px;font-weight:bold;text-align:center}
</style>
</head>
<body>
<h1>FlashScore - FOOTBALL API</h1>
<div id="dates"></div>
<div id="filters">
<button class="on" onclick="setF('ALL',this)">ALL</button>
<button onclick="setF('LIVE',this)">LIVE</button>
<button onclick="setF('FINISHED',this)">FINISHED</button>
<button onclick="setF('UPCOMING',this)">UPCOMING</button>
</div>
<div id="list">Loading...</div>
<script>
let sel = new Date().toISOString().slice(0,10);
let filter='ALL';
let all=[];
function setF(f,btn){filter=f;document.querySelectorAll('#filters button').forEach(b=>b.className='');btn.className='on';show(all)}
function gen(){
let d=document.getElementById('dates');d.innerHTML='';
for(let i=-2;i<=5;i++){
let dt=new Date();dt.setDate(dt.getDate()+i);
let iso=dt.toISOString().slice(0,10);
let txt=dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
let dn=dt.toLocaleDateString('en-GB',{weekday:'short'});
if(i==0)dn='TODAY';if(i==1)dn='TOM';if(i==-1)dn='YEST';
let el=document.createElement('div');
el.innerHTML='<small>'+dn+'</small><br><b>'+txt+'</b>';
if(iso==sel)el.className='on';
el.onclick=function(){sel=iso;document.querySelectorAll('#dates div').forEach(x=>x.className='');el.className='on';load()};
d.appendChild(el);
}
}
gen();
async function load(){
document.getElementById('list').innerHTML='Loading '+sel+'...';
try{
let r=await fetch('/api/matches?date='+sel);
let j=await r.json();
if(j.error){document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center;color:red">Error: '+JSON.stringify(j.error)+'<br><small>'+JSON.stringify(j.full||j.apiError||'')+'</small></p>';return;}
all=j.response||[];show(all);
}catch(e){document.getElementById('list').innerHTML='Fail: '+e.message}
}
function show(data){
let f=data;
if(filter=='LIVE')f=data.filter(m=>['LIVE','1H','2H','HT'].includes(m.fixture.status.short));
if(filter=='FINISHED')f=data.filter(m=>['FT','AET','PEN'].includes(m.fixture.status.short));
if(filter=='UPCOMING')f=data.filter(m=>['NS','TBD'].includes(m.fixture.status.short));
if(f.length==0){document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center">No '+filter+' matches for '+sel+'<br>Try date 2025-10-15</p>';return;}
let h='';let last='';
f.forEach(m=>{
if(m.league.name!=last){h+='<div class=league>'+m.league.name+'</div>';last=m.league.name;}
h+='<div class=match><div class=time>'+m.berlinTime+'<br><small>'+m.fixture.status.short+'</small></div><div class=teams><div>'+m.teams.home.name+'</div><div>'+m.teams.away.name+'</div></div><div class=score>'+m.goals.home+'-'+m.goals.away+'</div></div>';
});
document.getElementById('list').innerHTML=h;
}
load();
</script>
</body>
</html>
