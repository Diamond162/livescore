<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FotMob - Livescore</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body { background:#121212; color:#fff; font-family: Roboto, Arial, sans-serif; font-size:14px }
.header { background:#000; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #222; position:sticky; top:0; z-index:10 }
.logo { font-weight:900; font-size:20px }.logo span{ color:#2ec17c }
.dateBox { line-height:14px }.dateBox b{ font-size:16px }.dateBox small{ font-size:11px; color:#888; display:block }
.nav { background:#1f1f1f; display:flex; gap:8px; padding:10px 12px; overflow-x:auto; border-bottom:1px solid #2a2a2a; position:sticky; top:49px; z-index:9 }
.nav a { padding:6px 12px; border-radius:6px; background:#2a2a2a; color:#888; font-weight:700; font-size:13px; text-decoration:none; white-space:nowrap; cursor:pointer }
.nav a.active { background:#fff; color:#000 }
.filter { background:#1f1f1f; display:flex; gap:10px; padding:8px 12px; border-bottom:2px solid #000; position:sticky; top:90px; z-index:8 }
.filter a { padding:4px 12px; border-radius:20px; background:#2a2a2a; color:#888; font-weight:700; font-size:12px; text-decoration:none; cursor:pointer }
.filter a.active { background:#3a3a3a; color:#fff }
.count { padding:8px 12px; color:#666; font-size:11px; background:#121212 }
.league { background:#2a2a2a; margin-top:4px }
.leagueHead { padding:9px 12px; display:flex; justify-content:space-between; align-items:center; background:#222; border-bottom:1px solid #333 }
.leagueHead b { font-size:13px; text-transform:uppercase; letter-spacing:0.3px }
.leagueHead a { color:#2ec17c; font-size:12px; text-decoration:underline; cursor:pointer }
.match { background:#1a1a1a; display:flex; align-items:center; padding:12px 12px; border-bottom:1px solid #252525; cursor:pointer }
.match:hover { background:#222 }
.time { width:52px; font-size:13px; color:#999; font-weight:600 }
.teams { flex:1; overflow:hidden }
.teams div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1px 0; font-size:14px }
.score { width:52px; text-align:right; font-weight:900; font-size:14px; color:#ff6a2c }
.score.live { color:#ff3b30 }
.dot { width:6px; height:6px; background:#ff3b30; border-radius:50%; display:inline-block; margin-right:4px; animation:blink 1s infinite }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
</style>
</head>
<body>
<div class="header">
  <div style="display:flex;gap:12px;align-items:center">
    <div style="font-size:22px">←</div>
    <div class="dateBox"><b id="dBig">Oct 12, 2026</b><small id="tSmall">09:56 PM • FotMob API</small></div>
  </div>
  <div class="logo">fot<span>mob</span></div>
</div>

<div class="nav" id="dateNav">
  <a data-d="yesterday">Yesterday</a>
  <a data-d="today" class="active">Today</a>
  <a data-d="tomorrow">Tomorrow</a>
  <a data-d="more">More days »</a>
</div>

<div class="filter" id="filterNav">
  <a data-f="all" class="active">All Games</a>
  <a data-f="live">LIVE</a>
  <a data-f="finished">Finished</a>
</div>

<div class="count" id="count">Loading FotMob real matches...</div>
<div id="list"></div>

<script>
let allData=[], curDate='', curFilter='all';
function toISO(d){ return d.toISOString().slice(0,10) }
function fromInputToFotMob(dateStr){
  return dateStr.replace(/-/g,'');
}
function getCurDateStr(){
  if(curDate==='today') return toISO(new Date());
  if(curDate==='yesterday'){ let d=new Date(); d.setDate(d.getDate()-1); return toISO(d); }
  if(curDate==='tomorrow'){ let d=new Date(); d.setDate(d.getDate()+1); return toISO(d); }
  return curDate || toISO(new Date());
}
function updateHeader(){
  let d=new Date(getCurDateStr());
  document.getElementById('dBig').textContent=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('tSmall').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' • FotMob API • '+getCurDateStr();
}
async function load(){
  let dateStr=getCurDateStr();
  updateHeader();
  document.getElementById('count').textContent='Loading '+dateStr+' from FotMob...';
  try{
    let r=await fetch('/api/football?date='+dateStr+'&t='+Date.now());
    let j=await r.json();
    allData=j.response||[];
  }catch(e){ allData=[]; }
  render();
}
function render(){
  let q=(curFilter);
  let filtered=allData.filter(m=>{
    let short=(m.fixture?.status?.short||'').toUpperCase();
    let isLive=['1H','2H','HT','LIVE'].includes(short);
    let isFT=['FT','AET','PEN'].includes(short);
    if(curFilter==='live' &&!isLive) return false;
    if(curFilter==='finished' &&!isFT) return false;
    return true;
  });
  // Group by league
  let groups={};
  filtered.forEach(m=>{
    let country=(m.league?.country||'INT').toUpperCase();
    let name=(m.league?.name||'Other').toUpperCase();
    let key=country+': '+name;
    if(key.includes('CHAMPIONS LEAGUE')) key='INT: CHAMPIONS LEAGUE';
    if(!groups[key]) groups[key]=[];
    groups[key].push(m);
  });
  document.getElementById('count').textContent=filtered.length+' games • '+getCurDateStr()+' • FotMob API';
  let html='';
  for(let key in groups){
    html+='<div class="league"><div class="leagueHead"><b>'+key+'</b><a>Standings</a></div>';
    groups[key].forEach(m=>{
      let time='--:--';
      if(m.fixture?.date) time=new Date(m.fixture.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
      if(m.fixture?.status?.short==='LIVE' && m.fixture?.status?.elapsed) time=m.fixture.status.elapsed+"'";
      if((m.fixture?.status?.short||'')==='FT') time='FT';
      let home=m.teams?.home?.name||'Home';
      let away=m.teams?.away?.name||'Away';
      let h=m.goals?.home, a=m.goals?.away;
      let score=(h!=null && a!=null)?h+'-'+a:'0-0';
      let liveClass=(m.fixture?.status?.short==='LIVE' || m.fixture?.status?.short==='1H' || m.fixture?.status?.short==='2H')?'live':'';
      let timeHtml=liveClass?'<span class="dot"></span>'+time:time;
      html+='<div class="match"><div class="time">'+timeHtml+'</div><div class="teams"><div>'+home+' - '+away+'</div></div><div class="score '+liveClass+'">'+score+'</div></div>';
    });
    html+='</div>';
  }
  if(!html) html='<div style="padding:40px;text-align:center;color:#666">No matches for '+getCurDateStr()+'<br>Try another date</div>';
  document.getElementById('list').innerHTML=html;
}
document.getElementById('dateNav').onclick=e=>{
  let a=e.target.closest('a'); if(!a) return;
  if(a.dataset.d==='more'){ let d=prompt('Enter date YYYY-MM-DD'); if(!d) return; curDate=d; } else { curDate=a.dataset.d; document.querySelectorAll('#dateNav a').forEach(x=>x.classList.remove('active')); a.classList.add('active'); }
  load();
};
document.getElementById('filterNav').onclick=e=>{
  let a=e.target.closest('a'); if(!a) return;
  curFilter=a.dataset.f;
  document.querySelectorAll('#filterNav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  render();
};
curDate='today';
load();
setInterval(load,60000);
</script>
</body>
</html>
