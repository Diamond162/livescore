<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}
.header{background:#111;border-bottom:1px solid #00ff88;padding:12px;text-align:center}
.header h1{color:#00ff88;font-size:15px}
.days{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#0a0a0a;border-bottom:1px solid #222}
.days::-webkit-scrollbar{display:none}
.day{min-width:75px;background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer}
.day.active{background:#00ff88;color:#000;font-weight:800}
.day small{display:block;font-size:10px}.day b{display:block;font-size:12px;margin-top:3px}
.filters{display:flex;gap:6px;padding:10px;overflow-x:auto}
.f{background:#1a1a1a;border:1px solid #333;padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
.f.active{background:#00ff88;color:#000;font-weight:700}
.search{padding:0 10px 10px}.search input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}
.league{background:#1a1a1a;padding:8px 10px;font-weight:800;font-size:11px;text-transform:uppercase;display:flex;justify-content:space-between;border-top:1px solid #222}
.league.top{background:#002b15;border-left:3px solid #00ff88;color:#00ff88}
.row{display:flex;align-items:center;padding:10px;border-bottom:1px solid #151515;font-size:13px;background:#0e0e0e}
.row.live{background:#1a1010}.t{width:50px;color:#00ff88;font-weight:800}.t.live{color:#ff3b30}.n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.s{width:60px;text-align:right;font-weight:700}
.info{padding:40px;text-align:center;color:#777}
</style>
</head>
<body>
<div class="header"><h1>⚽ LiveScore - BLACK & GREEN - Europe/Berlin Time</h1></div>
<div class="days" id="days"></div>
<div class="filters"><div class="f active" data-f="all">All</div><div class="f" data-f="live">🔴 Live</div><div class="f" data-f="finished">Finished</div><div class="f" data-f="scheduled">Scheduled</div></div>
<div class="search"><input id="q" placeholder="Search team, league..."></div>
<div id="list"><div class="info">Loading...</div></div>
<script>
let All=[], curF='all', curLabel='today', curISO='';
function priority(l){
  const s=(l.country+' '+l.name).toLowerCase();
  if(s.includes('champions league')) return 1;
  if(s.includes('europa league')) return 2;
  if(s.includes('conference league')) return 3;
  if(s.includes('premier league')||s.includes('england: premier')) return 4;
  if(s.includes('la liga')||s.includes('spain: la liga')) return 5;
  if(s.includes('bundesliga')) return 6;
  if(s.includes('serie a')) return 7;
  if(s.includes('ligue 1')) return 8;
  if(s.includes('afc champions')) return 9;
  if(s.includes('gcc champions')) return 10;
  if(s.includes('championship')) return 11;
  return 100;
}
function toEuropeTime(dateStr){
  if(!dateStr) return '';
  try{
    let iso=dateStr.toString().trim().replace(' ','T');
    if(iso.endsWith('Z')===false && iso.indexOf('+')===-1 && iso.indexOf('Z')===-1){
      // assume UTC if no timezone
      if(iso.includes('T')) iso+='Z';
    }
    const d=new Date(iso);
    if(isNaN(d)) {
      // fallback parse HH:MM
      const m=dateStr.match(/(\d{1,2}):(\d{2})/);
      if(m) return m[0];
      return dateStr;
    }
    return d.toLocaleTimeString('en-GB',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hour12:false});
  }catch(e){ return ''; }
}
function liveText(f){
  if(f.fixture.status.short==='HT') return 'HT';
  if(f.fixture.status.short==='FT') return 'FT';
  if(f.fixture.minute) return f.fixture.minute+"'";
  if(f.fixture.status.short==='LIVE') return 'LIVE';
  return f.fixture.status.short;
}
function buildDays(){
  const cont=document.getElementById('days');
  const today=new Date();
  let html='';
  const labels=[-3,-2,-1,0,1,2,3,4];
  labels.forEach(i=>{
    const dt=new Date(today); dt.setDate(today.getDate()+i);
    const iso=dt.toISOString().split('T')[0];
    let lab=''; let display='';
    if(i===-1) lab='yesterday';
    else if(i===0) lab='today';
    else if(i===1) lab='tomorrow';
    else lab=iso;
    const dayName=dt.toLocaleDateString('en-US',{weekday:'short'});
    const active=i===0?'active':'';
    if(i===0) {curLabel=lab; curISO=iso;}
    display=dt.getDate()+' '+dt.toLocaleDateString('en-US',{month:'short'});
    html+=`<div class="day ${active}" data-label="${lab}" data-iso="${iso}"><small>${i===0?'TODAY':i===-1?'YESTERDAY':i===1?'TOMORROW':dayName}</small><b>${display}</b></div>`;
  });
  cont.innerHTML=html;
  cont.querySelectorAll('.day').forEach(el=>{
    el.addEventListener('click',()=>{
      cont.querySelectorAll('.day').forEach(d=>d.classList.remove('active'));
      el.classList.add('active');
      curLabel=el.dataset.label;
      curISO=el.dataset.iso;
      load();
    });
  });
}
async function load(){
  document.getElementById('list').innerHTML='<div class="info">Loading '+curLabel+'...</div>';
  let url=`/api/matches?date=${curLabel}`;
  if(curLabel==='today'||curLabel==='yesterday'||curLabel==='tomorrow') url=`/api/matches?date=${curLabel}`;
  else if(curLabel.includes('-')) url=`/api/matches?date=${curLabel}`;
  else url=`/api/matches?date=all`;

  try{
    const r=await fetch(url);
    const j=await r.json();
    All=j.response||[];
    render();
  }catch(e){
    document.getElementById('list').innerHTML='<div class="info">Error: '+e.message+'</div>';
  }
}
function render(){
  let filtered=All;
  if(curF==='live') filtered=All.filter(m=>m.fixture.status.short==='LIVE');
  if(curF==='finished') filtered=All.filter(m=>m.fixture.status.short==='FT');
  if(curF==='scheduled') filtered=All.filter(m=>m.fixture.status.short==='NS');
  const q=document.getElementById('q').value.toLowerCase();
  if(q) filtered=filtered.filter(m=> (m.teams.home.name+' '+m.teams.away.name+' '+m.league.name).toLowerCase().includes(q));

  // sort by priority then time
  filtered.sort((a,b)=>{
    if(a.fixture.status.short==='LIVE' && b.fixture.status.short!=='LIVE') return -1;
    if(b.fixture.status.short==='LIVE' && a.fixture.status.short!=='LIVE') return 1;
    const pa=priority(a.league), pb=priority(b.league);
    if(pa!==pb) return pa-pb;
    return a.fixture.berlinTime.localeCompare(b.fixture.berlinTime);
  });

  // group by league
  const groups={};
  filtered.forEach(m=>{ const k=m.league.name; if(!groups[k]) groups[k]=[]; groups[k].push(m); });

  let html='';
  const leagueNames=Object.keys(groups).sort((a,b)=>{
    const ma=groups[a][0], mb=groups[b][0];
    return priority(ma.league)-priority(mb.league);
  });

  if(leagueNames.length===0){ html='<div class="info">No matches found for '+curLabel+'</div>'; }
  leagueNames.forEach(lname=>{
    const isTop=priority(groups[lname][0].league)<20;
    html+=`<div class="league ${isTop?'top':''}"><span>${lname}</span><span>STANDINGS</span></div>`;
    groups[lname].forEach(m=>{
      const isLive=m.fixture.status.short==='LIVE';
      const tText=m.fixture.status.short==='FT'? 'FT' : isLive? (m.fixture.minute? m.fixture.minute+"'" : 'LIVE') : m.fixture.berlinTime || toEuropeTime(m.fixture.date);
      const score = (m.goals.home!==null && m.goals.home!==undefined)? `${m.goals.home} - ${m.goals.away}` : '-';
      const showScore = m.fixture.status.short==='NS'? '-' : score;
      html+=`<div class="row ${isLive?'live':''}"><div class="t ${isLive?'live':''}">${tText}</div><div class="n">${m.teams.home.name} - ${m.teams.away.name}</div><div class="s">${showScore}</div></div>`;
    });
  });
  document.getElementById('list').innerHTML=html;
}
document.querySelectorAll('.f').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.f').forEach(f=>f.classList.remove('active'));
    el.classList.add('active');
    curF=el.dataset.f;
    render();
  });
});
document.getElementById('q').addEventListener('input',render);
buildDays();
load();
</script>
</body>
</html>
