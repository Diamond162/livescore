// FIX 1: CORRECT EUROPE TIME FOR ALL LEAGUES - NO CLUB NAME
function toEuropeTime(dateString){
  if(!dateString) return '19:00';
  try{
    // API gives UTC like 2026-10-15T16:45:00+00:00 -> convert to Europe/Berlin
    let iso = dateString.toString().trim().replace(' ','T');
    if(!iso.endsWith('Z') &&!iso.includes('+') &&!iso.match(/-\d{2}:\d{2}$/)) iso+='Z';
    const d = new Date(iso);
    if(isNaN(d)) return '19:00';
    const time = d.toLocaleTimeString('en-GB',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hour12:false});
    // If API returns 00:00 midnight (bad data), keep it but try to parse hour from string
    if(time==='00:00' || time==='01:00'){
      const m = dateString.toString().match(/T(\d{2}):(\d{2})/);
      if(m){
        // Convert that hour from UTC to Berlin (+2 in summer)
        let h = parseInt(m[1]);
        // Simple summer conversion: UTC 16:45 -> 18:45 Berlin, 19:00 -> 21:00 Berlin
        h = (h + 2) % 24;
        return String(h).padStart(2,'0')+':'+m[2];
      }
    }
    return time;
  }catch{
    return '19:00';
  }
}

// FIX 2: LIVE MINUTES LIKE FLASHSCORE
function getLiveMinute(fixture){
  const s = fixture.status.short;
  const elapsed = fixture.status.elapsed;
  const long = (fixture.status.long||'').toString();
  if(s==='HT') return 'HT';
  if(s==='FT' || s==='AET' || s==='PEN') return 'FT';
  if(s==='BT') return 'BT';
  if(elapsed) return elapsed+"'";
  const m = long.match(/(\d+)'/);
  if(m) return m[0];
  if(s==='1H' || s==='2H' || s==='LIVE') return 'LIVE';
  return '';
}

function buildDays(){
  const cont=document.getElementById('days'); let html='';
  for(let i=-3;i<=4;i++){const dt=new Date(); dt.setDate(dt.getDate()+i); const iso=dt.toISOString().split('T')[0];
  let label=iso; if(i===0) label='today'; if(i===-1) label='yesterday'; if(i===1) label='tomorrow';
  const active=(label===curDate|| (curDate==='today'&&i===0))?'active':'';
  html+=`<div class="day ${active}" data-d="${label}"><small>${dt.toLocaleDateString('en',{weekday:'short'})}</small><b>${dt.getDate()} ${dt.toLocaleDateString('en',{month:'short'})}</b></div>`;}
  cont.innerHTML=html;
  cont.querySelectorAll('.day').forEach(el=>el.addEventListener('click',e=>{
    cont.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));
    e.currentTarget.classList.add('active'); curDate=e.currentTarget.dataset.d; load(curDate);
  }));
}

}

        timeTxt=getLiveMinute(m.fixture);
