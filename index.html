#topBar{background:#111;padding:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

#topBar button.active{background:#00ff88;color:#000;font-weight:bold}
#filters{background:#0e0e0e;padding:8px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid #222}

.searchBox{padding:8px;background:#121212}

.league-header{background:#000;color:#ffcc00;padding:9px 10px;font-weight:bold;font-size:12px;text-transform:uppercase;border-left:4px solid #00ff88;display:flex;justify-content:space-between;margin-top:6px;position:sticky;top:52px}
.match-row{background:#151515;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #222;cursor:pointer}
.match-row:hover{background:#1e1e1e}
.match-row.liveRow{background:#1d1010}
.time{width:52px;font-size:13px;color:#888;font-weight:500}
.time.live{color:#ff3b3b;font-weight:bold}
.teams{flex:1}
.team{font-size:14px;line-height:18px}
.team.winner{font-weight:bold;color:#fff}
.score{width:62px;text-align:center;font-weight:bold;font-size:14px}
.score.finished{color:#00ff88}
.score.live{color:#ff3b3b}
.score.scheduled{color:#5aa8ff}
#detail{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:3px solid #00ff88;padding:18px;display:none;z-index:99}
#detail.show{display:block}
</style>
