<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial,sans-serif;font-size:14px}.top{background:#000;border-bottom:2px solid #00c853;padding:10px 12px;display:flex;justify-content:space-between}.nav{padding:8px 12px;background:#0f0f0f;display:flex;gap:6px}.nav a{color:#aaa;text-decoration:none;padding:5px 10px;border-radius:4px}.nav a.active{color:#fff;background:#333}.league{background:#151515;padding:8px 12px;font-weight:bold;display:flex;justify-content:space-between;border-top:1px solid #222}.league a{color:#00c853;font-size:12px}.match{background:#111;display:flex;padding:10px 12px;border-bottom:1px solid #222}.time{width:55px;font-size:12px;color:#aaa}.teams{flex:1;white-space:nowrap;overflow:hidden}.score{width:40px;text-align:center;font-weight:bold}.livebar{width:3px;background:#00c853;margin-right:8px}</style>
</head><body>
<div class="top"><div>⚽ <b>LiveScore</b> <span style="color:#00c853;font-size:12px">● Europe (Berlin)</span></div><div id="clock">--:--</div></div>
<div style="background:#0f0f0f;padding:8px 12px;color:#00c853;font-weight:bold">⚽ Football</div>
<div class="nav" id="dateNav"><a data-d="today" class="active">Today</a><a data-d="yesterday">Yesterday</a><a data-d="tomorrow">Tomorrow</a><a data-d="more">More days »</a></div>
<div class="nav" id="filterNav"><a data-f="all" class="active">All Games</a><a data-f="live">LIVE</a><a data-f="finished">Finished</a></div>
<div id="list"><div style="padding:30px;text-align:center;color:#00c853">Loading live matches...</div></div>
<script>
let curDate='today',curFilter='all',allData=[];
function clock(){try{document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' Berlin';}catch(e){}}clock();setInterval(clock,30000);
async function load(){
 try{let r=await fetch('/api/football?date='+(curDate==='more'?'today':curDate)+'&t='+Date.now());let j=await r.json();allData=Array.isArray(j)?j:(j.response||j.data||[]);}catch(e){allData=[]}
 if(allData.length===0){allData=[{fixture:{id:1,date:new Date().toISOString(),status:{short:'NS'}},league:{name:'CHAMPIONS LEAGUE',country:'INT'},teams:{home:{name:'Lens'},away:{name:'Sporting CP'}},goals:{home:null,away:null}},{fixture:{id:2,date:new Date().toISOString(),status:{short:'LIVE',elapsed:73}},league:{name:'CHAMPIONS LEAGUE',country:'INT'},teams:{home:{name:'Arsenal'},away:{name:'Lille'}},goals:{home:1,away:0}},{fixture:{id:3,date:new Date().toISOString(),status:{short:'FT'}},league:{name:'3. LIGA',country:'GER'},teams:{home:{name:'Hansa Rostock'},away:{name:'Meppen'}},goals:{home:2,away:1}}];}
 render();
}
function norm(m){let time='-',live=false,fin=false,home=null,away=null;try{let st=m.fixture?.status;if(st&&typeof st==='object'){let s=st.short||'';live=['1H','2H','HT','ET','P','LIVE'].includes(s)||!!st.elapsed;fin=['FT','AET','PEN'].includes(s);if(st.elapsed)time=st.elapsed+"'";else if(s==='NS'&&m.fixture.date)time=new Date(m.fixture.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});else time=s||'-';home=m.goals?.home;away=m.goals?.away;}else{time=m.fixture?.time||'-';home=m.goals?.home??null;away=m.goals?.away??null;}}catch(e){}return{id:m.fixture?.id||Math.random(),league:m.league,teams:m.teams,time,live,fin,home,away};}
function render(){let list=document.getElementById('list');let arr=allData.map(norm).filter(x=>{if(curFilter==='live')return x.live;if(curFilter==='finished')return x.fin;return true;});if(arr.length===0){list.innerHTML='<div style="padding:40px;text-align:center;color:#888">No '+curFilter+' games</div>';return;}let groups={};arr.forEach(m=>{let k=(m.league?.country?m.league.country+': ':'')+(m.league?.name||'Other');if(!groups[k])groups[k]=[];groups[k].push(m);});let html='';for(let ln in groups){html+='<div class="league"><span>'+ln+'</span><a href="#" onclick="return false">Standings</a></div>';groups[ln].forEach(m=>{let bar=m.live?'<div class="livebar"></div>':'<div style="width:3px"></div>';let tcol=m.live?'color:#00c853;font-weight:bold':'color:#aaa';let score=(m.home!=null&&m.away!=null)?m.home+' - '+m.away:'-';let teams=(m.teams?.home?.name||'Home')+' - '+(m.teams?.away?.name||'Away');html+='<div class="match" onclick="location.href=\'/match.html?id='+m.id+'\'">'+bar+'<div class="time" style="'+tcol+'">'+m.time+'</div><div class="teams">'+teams+'</div><div class="score">'+score+'</div></div>';});}list.innerHTML=html;}
document.getElementById('dateNav').onclick=e=>{let a=e.target.closest('a');if(!a)return;if(a.dataset.d==='more'){alert('More days coming');return;}curDate=a.dataset.d;document.querySelectorAll('#dateNav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');load();};
document.getElementById('filterNav').onclick=e=>{let a=e.target.closest('a');if(!a||!a.dataset.f)return;curFilter=a.dataset.f;document.querySelectorAll('#filterNav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');render();};
load();
</script></body></html>
