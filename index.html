<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore - Europe Time</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}
header{padding:12px;background:#9a1111;text-align:center;font-weight:bold;font-size:20px;position:sticky;top:0;z-index:10}
#filters{padding:8px;display:flex;gap:8px;flex-wrap:wrap;background:#1a1a1a;position:sticky;top:46px}
#filters button{padding:6px 12px;border:1px solid #333;background:#222;color:#fff;border-radius:20px}
#filters button.active{background:#ff6600}
#app{padding:8px}
.match{padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between;flex-wrap:wrap}
.league{width:100%;font-size:12px;color:#aaa;margin-bottom:4px}
.teams{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.teams span{flex:1}
.teams span:nth-child(1){text-align:right}
.teams span:nth-child(3){text-align:left}
.live{color:#ff4444;font-weight:bold}
.finished{color:#888}
.scheduled{color:#4da3ff}
</style>
</head>
<body>
<header>LiveScore - Europe Time</header>
<div style="padding:8px;display:flex;gap:8px;justify-content:center;background:#111">
<button onclick="setDate('yesterday')">Yesterday</button>
<button onclick="setDate('today')" style="background:#ff6600">Today</button>
<button onclick="setDate('tomorrow')">Tomorrow</button>
<input type="date" id="pickDate" onchange="pick(this.value)">
</div>
<div id="filters">
<button onclick="setFilter('All')" id="All" class="active">All</button>
<button onclick="setFilter('Live')" id="Live">Live</button>
<button onclick="setFilter('Scheduled')" id="Scheduled">Scheduled</button>
<button onclick="setFilter('Finished')" id="Finished">Finished</button>
<button onclick="fetchData()">Refresh</button>
</div>
<div style="padding:8px"><input id="search" type="text" placeholder="Search team..." style="width:100%;padding:10px;background:#222;border:1px solid #333;color:#fff" oninput="render(document.querySelector('#filters.active').id)"></div>
<div id="app">Loading matches...</div>
<script>
let allFixtures=[]; let currentDate=new Date().toISOString().split('T')[0];
function setFilter(f){document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));let el=document.getElementById(f);if(el)el.classList.add('active');render(f);}
function setDate(d){if(d==='yesterday'){let t=new Date();t.setDate(t.getDate()-1);currentDate=t.toISOString().split('T')[0];}else if(d==='tomorrow'){let t=new Date();t.setDate(t.getDate()+1);currentDate=t.toISOString().split('T')[0];}else currentDate=new Date().toISOString().split('T')[0];fetchData();}
function pick(v){if(v){currentDate=v;fetchData();}}
function getStatusText(f){let s=(f.fixture.status.short||'NS');if(['1H','HT','2H','ET','P','LIVE'].includes(s))return{text:f.fixture.status.elapsed||'LIVE',cls:'live'};if(s==='FT')return{text:'FT',cls:'finished'};return{text:new Date(f.fixture.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),cls:'scheduled'};}
function render(filter){filter=filter||'All';let q=(document.getElementById('search').value||'').toLowerCase();let list=allFixtures.filter(x=>{let st=x.fixture.status.short;if(filter==='Live'&&!['1H','HT','2H','ET','P','LIVE'].includes(st))return false;if(filter==='Scheduled'&&st!=='NS')return false;if(filter==='Finished'&&st!=='FT')return false;if(q&&! (x.teams.home.name.toLowerCase().includes(q)||x.teams.away.name.toLowerCase().includes(q)))return false;return true;});let html='';list.forEach(m=>{let s=getStatusText(m);html+=`<div class="match"><div class="league">${m.league.name} - ${m.league.country||''}</div><div class="teams"><span>${m.teams.home.name}</span><span class="${s.cls}">${m.goals.home??''} - ${m.goals.away??''} ${s.text}</span><span>${m.teams.away.name}</span></div></div>`;});document.getElementById('app').innerHTML=html||'<div style="padding:20px">No matches</div>';}
async function fetchData(){document.getElementById('app').innerHTML='<div style="padding:20px">Loading...</div>';try{const res=await fetch(`/api/matches?date=${currentDate}`);const text=await res.text();const data=JSON.parse(text);allFixtures=data.response||[];render('All');}catch(e){document.getElementById('app').innerHTML='Failed: '+e.message;}}
fetchData();
</script>
</body>
</html>
