<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashScore</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
h1{background:#000;color:#fff;padding:12px;text-align:center;margin:0;font-size:15px}
#dates{display:flex;gap:5px;padding:8px;background:#fff;overflow:auto}
#dates div{border:1px solid #ddd;padding:6px 10px;border-radius:5px;min-width:55px;text-align:center;background:#fff}
#dates div.on{border:2px solid #000;font-weight:bold;background:#fffbe6}
#filters{display:flex;gap:5px;padding:8px;background:#fff;border-bottom:1px solid #eee}
#filters button{padding:6px 12px;border:1px solid #ddd;background:#fff;border-radius:5px}
#filters button.on{background:#000;color:#fff}
.league{background:#e8e8e8;padding:6px 8px;font-size:11px;color:#555;font-weight:bold}
.match{display:flex;justify-content:space-between;padding:10px;background:#fff;border-bottom:1px solid #eee}
.time{width:55px;font-weight:bold;text-align:center}
.teams{flex:1;padding:0 8px}
.team{font-size:13px;line-height:17px}
.score{width:45px;font-weight:bold;text-align:center}
</style>
</head>
<body>
<h1>⚽ FlashScore - Berlin Time</h1>
<div id="dates"></div>
<div id="filters">
<button class="on" onclick="setF('ALL',this)">ALL</button>
<button onclick="setF('LIVE',this)">LIVE</button>
<button onclick="setF('FINISHED',this)">FINISHED</button>
<button onclick="setF('UPCOMING',this)">UPCOMING</button>
</div>
<div id="list">Loading...</div>
<script>
let sel=new Date().toISOString().slice(0,10);
let filter='ALL';
let all=[];
let loading=false;
function setF(f,btn){filter=f;document.querySelectorAll('#filters button').forEach(b=>b.className='');btn.className='on';show(all)}
function gen(){
let d=document.getElementById('dates');d.innerHTML='';
for(let i=-2;i<=5;i++){
let dt=new Date();dt.setDate(dt.getDate()+i);
let iso=dt.toISOString().slice(0,10);
let txt=dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
let dn=dt.toLocaleDateString('en-GB',{weekday:'short'});
if(i==0)dn='TODAY';if(i==1)dn='TOM';if(i==-1)dn='YEST';
let el=document.createElement('div');
el.innerHTML='<small>'+dn+'</small><br><b>'+txt+'</b>';
if(iso==sel)el.className='on';
el.onclick=function(){
if(loading)return;
sel=iso;document.querySelectorAll('#dates div').forEach(x=>x.className='');el.className='on';load()
};
d.appendChild(el);
}
}
gen();
async function load(){
if(loading)return;loading=true;
document.getElementById('list').innerHTML='<p style="padding:30px;text-align:center">Loading '+sel+'...<br><small>Please wait 1 sec (free API limit 1/min)</small></p>';
try{
let r=await fetch('/api/matches?date='+sel);
let j=await r.json();
if(j.error){
let msg=typeof j.error==='string'?j.error:JSON.stringify(j.error);
let extra=j.full?JSON.stringify(j.full).slice(0,400):'';
document.getElementById('list').innerHTML='<p style="padding:20px;text-align:center;color:red"><b>'+msg+'</b><br><br><small>'+extra+'</small><br><br>Tip: Try 2025-10-15 has many games. 2026 has no data on free plan.<br><br>Wait
