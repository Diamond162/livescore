<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlashScore LIVE</title>
<style>
body{margin:0;background:#0a0e1a;color:#fff;font-family:sans-serif}
header{background:#111827;padding:16px;text-align:center;font-weight:900;font-size:20px;color:#00ff88;border-bottom:2px solid #00ff88}
#days{display:flex;overflow:auto;gap:8px;padding:10px;background:#0f172a}
.day{padding:8px 14px;border-radius:20px;background:#1e293b;white-space:nowrap;cursor:pointer;font-size:13px}
.day.active{background:#38bdf8;color:#000;font-weight:700}
.match{background:#111827;margin:8px;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;border-left:3px solid #00ff88}
.team{font-size:14px}.score{font-weight:900;color:#38bdf8;font-size:18px}
.league{font-size:11px;color:#94a3b8;margin:8px 12px 2px}
#loading{text-align:center;padding:40px;color:#94a3b8}
.tab{padding:10px;text-align:center;flex:1;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{border-color:#00ff88;color:#00ff88}
#tabs{display:flex;background:#0f172a}
</style>
</head>
<body>
<header>⚡ FlashScore LIVE</header>
<div id="tabs"><div class="tab active">ALL</div><div class="tab">LIVE</div><div class="tab">FINISHED</div></div>
<div id="days"></div>
<div id="list"><div id="loading">Loading matches...</div></div>
<script>
const daysEl=document.getElementById('days');
const listEl=document.getElementById('list');
let selected=new Date().toISOString().split('T')[0];

function genDays(){
 for(let i=-3;i<=4;i++){
  let d=new Date(); d.setDate(d.getDate()+i);
  let iso=d.toISOString().split('T')[0];
  let el=document.createElement('div');
  el.className='day'+(iso===selected?' active':'');
  el.textContent=(i===0?'Today ':i===-1?'Yest ':i===1?'Tom ':'')+d.toLocaleDateString('en',{month:'short',day:'numeric'});
  el.onclick=()=>{selected=iso; document.querySelectorAll('.day').forEach(x=>x.classList.remove('active')); el.classList.add('active'); load();};
  daysEl.appendChild(el);
 }
}
genDays();

async function load(){
 listEl.innerHTML='<div id="loading">Loading '+selected+'...</div>';
 try{
  let r=await fetch('/api/matches?date='+selected);
  let j=await r.json();
  let ms=j.matches||[];
  if(ms.length===0){listEl.innerHTML='<div id="loading">No matches for '+selected+'<br><br>API returned: '+j.count+'<br>Try YEST / TODAY</div>'; return;}
  listEl.innerHTML='';
  let by={}; ms.forEach(m=>{let k=m.league||m.competition||'Other'; (by[k]=by[k]||[]).push(m);});
  for(let lg in by){
   let h=document.createElement('div'); h.className='league'; h.textContent=lg; listEl.appendChild(h);
   by[lg].forEach(m=>{
    let home=m.home_team||m.home||m.teams?.home||'Home';
    let away=m.away_team||m.away||m.teams?.away||'Away';
    let hs=m.home_score?? m.score?.home?? m.goals?.home?? '-';
    let as=m.away_score?? m.score?.away?? m.goals?.away?? '-';
    let status=m.status||m.state||'';
    let div=document.createElement('div'); div.className='match';
    div.innerHTML='<div><div class="team">'+home+'</div><div class="team" style="color:#94a3b8">'+away+'</div><div style="font-size:10px;color:#00ff88">'+status+'</div></div><div class="score">'+hs+' - '+as+'</div>';
    listEl.appendChild(div);
   });
  }
 }catch(e){listEl.innerHTML='<div id="loading">Error: '+e.message+'</div>';}
}
load();
</script>
</body>
</html>
