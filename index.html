<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond LiveScore - Live Football</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;margin:0;padding:20px}
h1{text-align:center;color:#22c55e}
#status{text-align:center;margin:10px;color:#94a3b8}
.match{background:#1e293b;margin:10px auto;max-width:600px;padding:15px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.team{font-weight:bold}
.score{font-size:20px;background:#000;padding:5px 12px;border-radius:8px}
.live{color:#ef4444;font-size:12px;font-weight:bold}
button{display:block;margin:20px auto;padding:10px 20px;background:#22c55e;border:none;border-radius:8px;color:#000;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h1>⚽ Diamond LiveScore</h1>
<div id="status">Loading live matches...</div>
<button onclick="loadMatches()">Refresh 🔄</button>
<div id="matches"></div>

<script>
async function loadMatches(){
  const statusEl = document.getElementById('status');
  const box = document.getElementById('matches');
  try{
    statusEl.textContent = 'Fetching live...';
    const res = await fetch('/.netlify/functions/matches');
    const json = await res.json();
    console.log(json);
    if(!json.success ||!json.data || json.data.length===0){
      statusEl.textContent = json.error? 'Error: '+json.error : 'No live matches right now - '+json.date;
      box.innerHTML = '';
      return;
    }
    statusEl.textContent = `Live - ${json.data.length} matches - ${json.date}`;
    box.innerHTML = json.data.map(m => {
      const home = m.homeTeam?.name || m.home_team || m.teams?.home || 'Home';
      const away = m.awayTeam?.name || m.away_team || m.teams?.away || 'Away';
      const hs = m.score?.fullTime?.home?? m.score?.home?? m.home_score?? '-';
      const as = m.score?.fullTime?.away?? m.score?.away?? m.away_score?? '-';
      const state = m.status || m.state || 'LIVE';
      return `<div class="match">
        <div><div class="live">${state}</div><div class="team">${home}</div><div class="team">${away}</div></div>
        <div class="score">${hs} - ${as}</div>
      </div>`;
    }).join('');
  }catch(e){
    statusEl.textContent = 'Failed to load: '+e.message;
  }
}
loadMatches();
setInterval(loadMatches, 30000);
</script>
</body>
</html>
