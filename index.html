<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlashScore - Live Scores</title>
<style>body{margin:0;font-family:Arial;background:#f5f5f5}header{background:#111;color:#fff;padding:15px;text-align:center;font-size:18px}.dates{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}.dates div{border:1px solid #ddd;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}.dates div.active{background:#111;color:#fff}.filters{display:flex;gap:8px;padding:10px}.filters button{padding:6px 14px;border-radius:20px;border:1px solid #ddd}.filters button.active{background:#111;color:#fff}.match{background:#fff;margin:8px;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.team{font-weight:600}.score{font-weight:bold;text-align:center}.status{font-size:11px;color:#888}</style>
</head><body>
<header>⚽ FlashScore</header>
<div class="dates" id="dates"></div>
<div class="filters"><button class="active" id="fALL">ALL</button><button id="fLIVE">LIVE</button><button id="fFINISHED">FINISHED</button><button id="fUPCOMING">UPCOMING</button></div>
<div id="list" style="padding:10px">Loading...</div>
<script>
let allData=[], curDate="", filter="ALL";
function initDates(){
 let d=document.getElementById('dates'); d.innerHTML="";
 for(let i=-2;i<=4;i++){let dt=new Date(); dt.setDate(dt.getDate()+i);
  let iso=dt.toISOString().split('T')[0];
  let label=dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); if(i==0) label="TODAY "+label; if(i==-1) label="YEST"; if(i==1) label="TOM";
  let el=document.createElement('div'); el.textContent=label; el.dataset.date=iso; if(i==0){el.classList.add('active'); curDate=iso;} el.onclick=()=>{document.querySelectorAll('.dates div').forEach(x=>x.classList.remove('active')); el.classList.add('active'); curDate=iso; load();}; d.appendChild(el);
 }
}
function setFilter(f){filter=f; document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active')); document.getElementById('f'+f).classList.add('active'); show();}

initDates();
document.getElementById('fALL').onclick=()=>setFilter('ALL');
document.getElementById('fLIVE').onclick=()=>setFilter('LIVE');
document.getElementById('fFINISHED').onclick=()=>setFilter('FINISHED');
document.getElementById('fUPCOMING').onclick=()=>setFilter('UPCOMING');

async function load(){
 document.getElementById('list').innerHTML='<div style="padding:20px;text-align:center">Loading... wait 1 sec (free API 1/min)</div>';
 try{
  let r=await fetch(`/api/matches?date=${curDate}`);
  let t=await r.text();
  let j; try{j=JSON.parse(t);}catch(e){throw new Error(t.slice(0,200));}
  allData=j.matches||j.data||[];
  show();
 }catch(e){document.getElementById('list').innerHTML=`<div style="color:red;padding:20px">Fail: ${e.message}</div>`;}
}

function show(){
 let filtered=allData;
 if(filter=="LIVE") filtered=filtered.filter(m=> (m.status||"").toLowerCase().includes('live')||m.status=='1H'||m.status=='2H'||m.status=='HT');
 if(filter=="FINISHED") filtered=filtered.filter(m=> (m.status||"").toLowerCase().includes('fin')||m.status=='FT'||m.status=='AET'||m.status=='PEN');
 if(filter=="UPCOMING") filtered=filtered.filter(m=> (m.status||"").toLowerCase().includes('not')||m.status=='NS'||m.status=='');
 let html="";
 if(!filtered.length){html=`<div style="text-align:center;padding:30px">No ${filter} matches for ${curDate}<br><small>Try other date - data is live</small></div>`;}
 filtered.forEach(m=>{
  let home=m.home?.name||m.teams?.home?.name||"Home";
  let away=m.away?.name||m.teams?.away?.name||"Away";
  let sh=m.score?.home??m.goals?.home??"-"; let sa=m.score?.away??m.goals?.away??"-";
  let status=m.status||m.fixture?.status?.short||"";
  let time=""; try{time=new Date(m.date||m.time||"").toLocaleTimeString('en-NG',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'});}catch(e){time=status;}
  html+=`<div class="match"><div><div class="team">${home}</div><div class="team">${away}</div><div class="status">${time} • ${status}</div></div><div class="score">${sh}<br>${sa}</div></div>`;
 });
 document.getElementById('list').innerHTML=html;
}
load();
</script></body></html>
