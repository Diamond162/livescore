<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Diamond Livescore - Flashscore Clone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;font-size:13px}
.header{background:#001e28;padding:12px 10px;position:sticky;top:0;z-index:10;border-bottom:2px solid #00b8d6}
.header h1{color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px}
.search-box{padding:8px;background:#0a0a0a}
.search-box input{width:100%;background:#222;border:1px solid #333;border-radius:6px;padding:10px;color:#fff;outline:none}
.tabs{display:flex;gap:6px;padding:8px;background:#111;overflow:auto}
.tab{padding:6px 14px;border-radius:15px;background:#222;color:#aaa;font-size:12px;white-space:nowrap;cursor:pointer}
.tab.active{background:#00b8d6;color:#fff}
.country-head{background:#1c1c1c;color:#fff;padding:7px 10px;font-weight:bold;font-size:12px;display:flex;justify-content:space-between;text-transform:uppercase;border-top:1px solid #333}
.country-head span:last-child{color:#00b8d6;font-weight:400;text-decoration:underline}
.match-row{display:flex;align-items:center;padding:8px 10px;background:#000;border-bottom:1px solid #1a1a1a}
.match-row:hover{background:#111}
.time{width:45px;color:#888;font-size:11px}
.teams{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.score{width:60px;text-align:right;font-weight:bold;font-size:13px}
.score.live{color:#ff2b2b}
.score.ft{color:#fff}
.score.up{color:#666}
.live-dot{width:6px;height:6px;background:red;border-radius:50%;display:inline-block;margin-right:3px;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}
</style>
</head>
<body>
<div class="header"><div style="display:flex;justify-content:space-between;align-items:center"><h1>💎 DIAMOND LIVESCORE</h1><small id="count" style="color:#aaa">Loading...</small></div></div>
<div class="search-box"><input id="search" placeholder="Search country, league, team..." oninput="render()"></div>
<div class="tabs">
<div class="tab active" data-f="all" onclick="setFilter('all')">All</div>
<div class="tab" data-f="live" onclick="setFilter('live')">🔴 Live</div>
<div class="tab" data-f="finished" onclick="setFilter('finished')">Finished</div>
<div class="tab" data-f="upcoming" onclick="setFilter('upcoming')">Upcoming</div>
</div>
<div id="app"><div style="padding:30px;text-align:center;color:#666">Loading real scores...</div></div>
<script>
let all=[]; let cur='all';
async function load(){
  try{
    const r=await fetch('/api/football'); const j=await r.json(); all=j.response||[];
    document.getElementById('count').textContent=all.length+' matches • '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){ document.getElementById('app').innerHTML='Error: '+e.message }
}
function setFilter(f){ cur=f; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.f===f)); render(); }
function getInfo(m){
  let s=(m.fixture?.status?.short||'').toString().toUpperCase();
  if(s.includes('LIVE')||s.includes('1H')||s.includes('2H')||s.includes('HT')) return {type:'LIVE',label:m.fixture?.status?.display||s};
  if(s==='FT' || s.includes('FT')) return {type:'FT',label:'FT'};
  if(s==='NS' || s==='UPCOMING' || s==='TBD' || s.includes('SCHEDULED')) return {type:'UPCOMING',label:m.fixture?.time||''};
  return {type:'FT',label:s||'FT'};
}
function render(){
  const app=document.getElementById('app'); const q=document.getElementById('search').value.toLowerCase();
  let filtered=all.filter(m=>{
    const info=getInfo(m);
    if(cur==='live'&&info.type!=='LIVE') return false;
    if(cur==='finished'&&info.type!=='FT') return false;
    if(cur==='upcoming'&&info.type!=='UPCOMING') return false;
    if(q){
      const txt=`${m.league?.country} ${m.league?.name} ${m.teams?.home?.name} ${m.teams?.away?.name}`.toLowerCase();
      if(!txt.includes(q)) return false;
    }
    return true;
  });
  const groups={};
  filtered.forEach(m=>{
    const country=(m.league?.country||'WORLD').toUpperCase();
    const league=m.league?.name||'FO
