<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashScore Lagos</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eee}
header{background:#111;color:#fff;padding:14px;text-align:center;font-weight:700;position:sticky;top:0;z-index:10}
.dates{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;position:sticky;top:48px;z-index:9}
.dates div{border:1px solid #ccc;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer;background:#fff;font-size:13px}
.dates div.active{background:#111;color:#fff}
.filters{display:flex;gap:8px;padding:10px;background:#fff}
.filters button{padding:7px 15px;border-radius:20px;border:1px solid #ccc;background:#fff;font-weight:600}
.filters button.active{background:#111;color:#fff}
#list{padding:8px}
.match{background:#fff;margin:8px 0;padding:12px;border-radius:12px;display:flex;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.team{font-weight:600;font-size:14px}
.score{font-weight:800;font-size:18px;text-align:center;min-width:40px}
.meta{font-size:11px;color:#888}
.live{color:#e00;font-weight:700}
</style>
</head>
<body>
<header>⚽ FlashScore Lagos</header>
<div class="dates" id="dates"></div>
<div class="filters">
<button class="active" id="bALL">ALL</button>
<button id="bLIVE">LIVE</button>
<button id="bFIN">FINISHED</button>
<button id="bUP">UPCOMING</button>
</div>
<div id="list">Loading...</div>
<script>
var matchesList=[],curDate="",curF="ALL";
function initDates(){
var w=document.getElementById("dates");w.innerHTML="";
for(var i=-1;i<=4;i++){
var dt=new Date();dt.setDate(dt.getDate()+i);
var iso=dt.toISOString().split("T")[0];
var lab=dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short"});
if(i==-1) lab="YEST";
if(i==0) lab="TODAY "+lab;
if(i==1) lab="TOM";
var el=document.createElement("div");el.textContent=lab;el.setAttribute("data-date",iso);
if(i==0){el.className="active";curDate=iso;}
el.onclick=function(){var d=this.getAttribute("data-date");var all=document.querySelectorAll(".dates div");for(var k=0;k<all.length;k++){all[k].className="";}this.className="active";curDate=d;load();};
w.appendChild(el);
}
}
function setF(f){
curF=f;
var all=document.querySelectorAll(".filters button");for(var k=0;k<all.length;k++){all[k].className="";}
var map={ALL:"bALL",LIVE:"bLIVE",FINISHED:"bFIN",UPCOMING:"bUP"};
document.getElementById(map[f]).className="active";
render();
}
document.getElementById("bALL").onclick=function(){setF("ALL");};
document.getElementById("bLIVE").onclick=function(){setF("LIVE");};
document.getElementById("bFIN").onclick=function(){setF("FINISHED");};
document.getElementById("bUP").onclick=function(){setF("UPCOMING");};

function getStatusStr(m){
var s=m.status;
if(!s) return "NS";
if(typeof s=="string") return s;
if(typeof s=="object") return s.short||s.code||s.type||s.name||"NS";
return String(s);
}

function load(){
var l=document.getElementById("list");
l.innerHTML='<div style="text-align:center;padding:20px">Loading '+curDate+'...</div>';
fetch("/api/matches?date="+curDate+"&lang=en").then(function(r){return r.json();}).then(function(d){
var arr=d.matches||[];
if(!Array.isArray(arr)){try{arr=Object.values(arr);}catch(e){arr=[];}}
matchesList=arr;
if(arr.length==0 && d.debug){
l.innerHTML='<div style="background:#fff;padding:15px;border-radius:10px">No matches from API. Debug: '+JSON.stringify(d.debug).slice(0,500)+'</div>';
return;
}
render();
}).catch(function(e){l.innerHTML='<div style="background:#fff;padding:15px;color:red">Error: '+e.message+'</div>';});
}

function render(){
var l=document.getElementById("list");
if(!Array.isArray(matchesList)) matchesList=[];
var f=[];
for(var i=0;i<matchesList.length;i++){f.push(matchesList[i]);}
if(curF=="LIVE"){var nf=[];for(var i=0;i<f.length;i++){var s=getStatusStr(f[i]).toUpperCase();if(s.indexOf("LIVE")>-1||["1H","2H","HT","ET"].indexOf(s)>-1){nf.push(f[i]);}}f=nf;}
if(curF=="FINISHED"){var nf=[];for(var i=0;i<f.length;i++){var s=getStatusStr(f[i]).toUpperCase();if(s.indexOf("FIN")>-1||["FT","AET","PEN"].indexOf(s)>-1){nf.push(f[i]);}}f=nf;}
if(curF=="UPCOMING"){var nf=[];for(var i=0;i<f.length;i++){var s=getStatusStr(f[i]).toUpperCase();if(s==""||["NS","TBD","PST","CANC","SCHEDULED","NOT STARTED"].indexOf(s)>-1){nf.push(f[i]);}}f=nf;}
if(f.length==0){l.innerHTML='<div style="text-align:center;padding:30px;background:#fff;border-radius:12px">No '+curF+' matches for '+curDate+'<br><small>Check /api/matches?date='+curDate+'</small></div>';return;}
var h="";
for(var i=0;i<f.length;i++){
var m=f[i];
var home=(m.home&&m.home.name)?m.home.name:"Home";
var away=(m.away&&m.away.name)?m.away.name:"Away";
var hs=(m.score&&m.score.home!=null)?m.score.home:"-";
var as=(m.score&&m.score.away!=null)?m.score.away:"-";
var st=getStatusStr(m);
var lg=(m.league&&m.league.name)?m.league.name:"League";
var timeStr="";
try{if(m.date){timeStr=new Date(m.date).toLocaleTimeString("en-NG",{hour:"2-digit",minute:"2-digit",timeZone:"Africa/Lagos"})+" • ";}}catch(e){}
h+='<div class="match"><div style="flex:1"><div class="meta">'+lg+'</div><div class="team">'+home+'</div><div class="team">'+away+'</div><div class="meta '+(st.toUpperCase().indexOf("LIVE")>-1?"live":"")+'">'+timeStr+st+'</div></div><div class="score">'+hs+'<br>'+as+'</div></div>';
}
l.innerHTML=h;
}
initDates();
load();
</script>
</body>
</html>
