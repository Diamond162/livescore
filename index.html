<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashScore Lagos - LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;padding-bottom:20px}
.header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #00ff88;position:sticky;top:0;z-index:10}
.header h1{font-size:20px}.header h1 span{color:#00ff88}
.header p{font-size:12px;color:#888;margin-top:3px}
.tabs{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#0a0a0a;position:sticky;top:68px;z-index:9}
.tab{padding:8px 16px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#aaa;font-size:13px;white-space:nowrap;cursor:pointer}
.tab.active{background:#00ff88;color:#000;border-color:#00ff88;font-weight:bold}
.filters{display:flex;gap:8px;padding:0 10px 10px;overflow-x:auto}
.f{padding:6px 14px;border-radius:15px;background:#222;color:#aaa;font-size:12px;border:1px solid #333;cursor:pointer}
.f.active{background:#fff;color:#000}
.league{padding:10px 15px;color:#666;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-top:10px}
.match{background:#151515;border-left:3px solid #333;padding:12px 15px;margin:5px 10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
.match.live{border-left-color:#00ff88}
.match.finished{border-left-color:#555}
.team{font-size:14px}.team strong{color:#fff}.team small{color:#888;display:block;font-size:13px}
.score{font-size:22px;font-weight:bold;color:#00ff88;min-width:60px;text-align:right}
.score.finished{color:#aaa}
.status{font-size:11px;margin-top:4px}.status.live{color:#00ff88}.status.up{color:#00ff88}.status.fin{color:#666}
#loading{text-align:center;padding:40px;color:#666}
</style>
</head>
