<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FotMob - Top Leagues Live</title>
<style>
body{margin:0;background:#121212;color:#fff;font-family:Roboto,Arial,sans-serif}
.top-bar{background:#000;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}
.date-nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#1a1a1a}
.date-nav div{padding:6px 12px;background:#2a2a2a;border-radius:16px;white-space:nowrap;cursor:pointer;font-size:14px}
.date-nav div.active{background:#fff;color:#000;font-weight:700}
.league{margin-top:8px;background:#222a2a;border-bottom:1px solid #2a3232;padding:8px}
.league-name{font-size:12px;text-transform:uppercase;opacity:0.8}
.match{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;padding:10px;border-bottom:1px solid #252525}
.time{font-size:11px;opacity:0.7;min-width:50px}
.teams{flex:1}
.score{font-weight:700;min-width:50px;text-align:right}
.live{color:#ff3b3b;font-weight:900;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="top-bar"><div class="logo">FotMob</div><div id="todayDate"></div></div>
<div class="date-nav" id="dateNav"></div>
<div id="matches">Loading...</div>

<script>
const COUNTRY_FULL = {"INT":"International","GER":"Germany","ENG":"England","ESP":"Spain","ITA":"Italy","FRA":"France","POR":"Portugal","NED":"Netherlands","BEL":"Belgium","TUR":"Turkey","BRA":"Brazil","ARG":"Argentina","USA":"USA","SCO":"Scotland","AUT":"Austria","SUI":"Switzerland","DEN":"Denmark","NOR":"Norway","SWE":"Sweden","POL":"Poland","UKR":"Ukraine","CZE":"Czech","CRO":"Croatia","SRB":"Serbia","GRE":"Greece","JPN":"Japan","KOR":"South Korea","AUS":"Australia","SAU":"Saudi Arabia","EGY":"Egypt","MAR":"Morocco","NGA":"Nigeria"};
function getCountryName(c){ if(!c) return 'International'; c=c.toUpperCase(); return COUNTRY_FULL[c]||c; }

function getPriority(leagueName,country){
  const n = leagueName.toLowerCase(); const cc = (country||'').toLowerCase();
  if(n.includes('champions league')) return 1;
  if(n.includes('europa league')) return 2;
  if(n.includes('premier league') && (cc.includes('eng')||n.includes('eng'))) return 4;
  if(n.includes('la liga') || n.includes('laliga')) return 5;
  if(n.includes('bundesliga')) return 6;
  if(n.includes('ligue 1')) return 8;
  if(n.includes('serie a') && cc.includes('ita')) return 7;
  if(n.includes('eredivisie')) return 9;
  if(n.includes('super lig')||n.includes('superlig')) return 10;
  if(n.includes('championship')) return 12;
  if(n.includes('serie a') && n.includes('brazil')) return 90;
  if(n.includes('pro') && n.includes('saudi')) return 80;
  return 50;
}

function allDates(){
  let cur = new Date(); cur.setHours(0,0,0,0);
  let dates=[]; for(let i=-3;i<=4;i++){ let d=new Date(cur); d.setDate(cur.getDate()+i); dates.push(d); } return dates;
}
function formatDate(d){ return d.toISOString().slice(0,10); }
function getLabel(d){
  let cur=new Date(); cur.setHours(0,0,0,0);
  let diff=Math.round((d-cur)/86400000);
  if(diff===0) return 'Today'; if(diff===-1) return 'Yesterday'; if(diff===1) return 'Tomorrow';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

let currentDate = formatDate(new Date());
document.getElementById('todayDate').textContent=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

function renderDates(){
  const nav=document.getElementById('dateNav');
  nav.innerHTML='';
  allDates().forEach(d=>{
    let fd=formatDate(d);
    let div=document.createElement('div');
    div.textContent=getLabel(d);
    if(fd===currentDate) div.classList.add('active');
    div.onclick=()=>{ currentDate=fd; renderDates(); loadMatches(); };
    nav.appendChild(div);
  });
}

async function loadMatches(){
  const box=document.getElementById('matches');
  box.innerHTML='Loading...';
  try{
    let r=await fetch('/api/football?date='+currentDate+'&t='+Date.now());
    let j=await r.json();
    let data=j.response||[];
    if(!data.length){ box.innerHTML='<div style="padding:20px;text-align:center">No matches for '+currentDate+'</div>'; return; }

    // group by league
    let leagues={};
    data.forEach(m=>{
      let key=m.league.name+'|'+m.league.country;
      if(!leagues[key]) leagues[key]={...m.league, matches:[], priority:getPriority(m.league.name,m.league.country)};
      leagues[key].matches.push(m);
    });
    let sorted=Object.values(leagues).sort((a,b)=>a.priority-b.priority);

    let html='';
    sorted.forEach(l=>{
      html+=`<div class="league"><div class="league-name">${getCountryName(l.country)} - ${l.name}</div></div>`;
      l.matches.forEach(m=>{
        let status=m.fixture.status.short;
        let isLive=status==='LIVE';
        let timeText=isLive?`<span class="live">${m.fixture.status.elapsed||'LIVE'}</span>`: (status==='FT'? 'FT' : new Date(m.fixture.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
        let score=(m.goals.home!=null)? `${m.goals.home} - ${m.goals.away}` : 'vs';
        html+=`<div class="match"><div class="time">${timeText}</div><div class="teams"><div>${m.teams.home.name}</div><div>${m.teams.away.name}</div></div><div class="score">${score}</div></div>`;
      });
    });
    box.innerHTML=html;
  }catch(e){ box.innerHTML='Error: '+e.message; }
}

renderDates(); loadMatches();
</script>
</body>
</html>
