<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FotMob</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#121212;color:#fff;font-family:Roboto,Arial,sans-serif}
.top{background:#000;padding:14px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px}.logo span{color:#2ec17c}
.nav{background:#1e1e1e;display:flex;gap:8px;padding:10px 12px;overflow-x:auto}
.nav a{padding:7px 14px;border-radius:8px;background:#2a2a2a;color:#8a8a8a;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.nav a.active{background:#fff;color:#000}
.filter{background:#1e1e1e;display:flex;gap:8px;padding:8px 12px}
.filter a{padding:5px 14px;border-radius:20px;background:#2a2a2a;color:#8a8a8a;font-weight:700;font-size:13px;text-decoration:none}
.filter a.active{background:#3a3a3a;color:#fff}
.count{padding:8px 12px;color:#666;font-size:12px}
.league{margin-top:4px;background:#222}
.leagueHead{padding:10px 12px;display:flex;justify-content:space-between;background:#2a2a2a}
.leagueHead b{font-size:13px;text-transform:uppercase}
.row{display:flex;padding:13px 12px;background:#1a1a1a;border-bottom:1px solid #252525}
.time{width:60px;color:#999;font-size:13px;font-weight:600}
.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.score{width:45px;text-align:right;font-weight:900}
.score.ns{color:#555}.score.live{color:#ff3b30}.score.ft{color:#fff}
.dot{width:6px;height:6px;background:#ff3b30;border-radius:50%;display:inline-block;margin-right:5px;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>
<div class="top"><div><b id="dateBig">Oct 13, 2026</b><small id="dateSmall">FotMob API • Europe Time (CET)</small></div><div class="logo">fot<span>mob</span></div></div>
<div class="nav" id="nav"><a data-d="yesterday">Yesterday</a><a data-d="today">Today</a><a data-d="tomorrow" class="active">Tomorrow</a><a data-d="more">More days »</a></div>
<div class="filter" id="fil"><a data-f="all" class="active">All Games</a><a data-f="live">LIVE</a><a data-f="finished">Finished</a></div>
<div class="count" id="count">Loading...</div>
<div id="list"></div>
<script>
let all=[],cur='tomorrow',fil='all';
function iso(d){return d.toISOString().slice(0,10)}
function getDate(){if(cur==='today')return iso(new Date());if(cur==='yesterday'){let d=new Date();d.setDate(d.getDate()-1);return iso(d)}if(cur==='tomorrow'){let d=new Date();d.setDate(d.getDate()+1);return iso(d)}return cur}
async function load(){
 let date=getDate();
 document.getElementById('dateBig').textContent=new Date(date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
 document.getElementById('dateSmall').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' • Europe/Berlin • '+date;
 document.getElementById('count').textContent='Loading '+date+'...';
 try{let r=await fetch('/api/football?date='+date+'&t='+Date.now());let j=await r.json();all=j.response||[]}catch(e){all=[]}
 render();
}
function render(){
 let filtered=all.filter(m=>{
  let s=(m.fixture?.status?.short||'NS').toUpperCase();
  if(fil==='live'&&!['LIVE','1H','2H','HT'].includes(s))return false;
  if(fil==='finished'&&s!=='FT')return false;
  return true;
 });
 let groups={};
 filtered.forEach(m=>{
  let k=(m.league?.country||'INT')+': '+m.league.name.toUpperCase();
  if(k.includes('CHAMPIONS'))k='INT: CHAMPIONS LEAGUE';
  if(!groups[k])groups[k]=[];
  groups[k].push(m);
 });
 document.getElementById('count').textContent=filtered.length+' games • '+getDate()+' • Europe Time';
 let html='';
 for(let k in groups){
  html+='<div class="league"><div class="leagueHead"><b>'+k+'</b><a style="color:#2ec17c">Standings</a></div>';
  groups[k].forEach(m=>{
   let d=new Date(m.fixture?.date||new Date());
   // EUROPE TIME - CET/CEST (Berlin)
   let t=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Berlin'});
   let short=(m.fixture?.status?.short||'NS').toUpperCase();
   let score='',cls='';
   if(short==='NS'){cls='ns';score='-';}
   else if(['LIVE','1H','2H','HT'].includes(short)){cls='live';score=(m.goals?.home??0)+'-'+(m.goals?.away??0);t='<span class="dot"></span>'+(m.fixture?.status?.elapsed||'')+"' "+t;}
   else if(short==='FT'){cls='ft';score=(m.goals?.home??0)+'-'+(m.goals?.away??0);t='FT';}
   else{cls='ns';score='-';}
   html+='<div class="row"><div class="time">'+t+'</div><div class="name">'+m.teams.home.name+' - '+m.teams.away.name+'</div><div class="score '+cls+'">'+score+'</div></div>';
  });
  html+='</div>';
 }
 if(!html) html='<div style="padding:50px;text-align:center;color:#666">No matches</div>';
 document.getElementById('list').innerHTML=html;
}
document.getElementById('nav').onclick=e=>{let a=e.target.closest('a');if(!a)return;if(a.dataset.d==='more'){let d=prompt('YYYY-MM-DD');if(!d)return;cur=d}else{cur=a.dataset.d;document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('active'));a.classList.add('active');}load();};
document.getElementById('fil').onclick=e=>{let a=e.target.closest('a');if(!a)return;fil=a.dataset.f;document.querySelectorAll('#fil a').forEach(x=>x.classList.remove('active'));a.classList.add('active');render();};
load();
setInterval(load,60000);
</script>
</body>
</html>
