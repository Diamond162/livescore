<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveScore - Europe Time</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
header{background:#900;padding:12px;text-align:center;font-size:22px;font-weight:700;border-bottom:2px solid #FF6600}
#filters button,#dateBar button{padding:6px 12px;border-radius:16px;border:1px solid #333;background:#111;color:#ccc;margin:2px;font-size:13px}
#filters button.active,#dateBar button.active{background:#FF6600;color:#fff;border-color:#FF6600}
#search{width:100%;padding:10px;background:#111;border:1px solid #333;color:#fff;border-radius:8px;margin:8px 0}
.league{background:#1a1a1a;padding:8px 12px;font-weight:700;border-bottom:1px solid #222;color:#FF6600}
.match{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #151515;background:#000}
.time{font-size:12px;width:55px;text-align:center;color:#aaa}
.team{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-weight:800;color:#FF6600;width:45px;text-align:center}
</style>
</head>
<body>
<header>LiveScore - Europe Time</header>
<div style="padding:8px">
<div id="dateBar">
<button onclick="setDate('today')" id="d-today" class="active">Today (EU)</button>
<button onclick="setDate('yesterday')" id="d-yesterday">Yesterday</button>
<button onclick="setDate('tomorrow')" id="d-tomorrow">Tomorrow</button>
<input type="date" id="pickDate" onchange="pick(this.value)">
</div>
<div id="filters">
<button onclick="setFilter('all')" id="f-all" class="fbtn active">All</button>
<button onclick="setFilter('live')" id="f-live" class="fbtn">Live</button>
<button onclick="setFilter('scheduled')" id="f-scheduled" class="fbtn">Scheduled</button>
<button onclick="forceRefresh()" id="refreshBtn" style="background:#222;border-color:#FF6600;color:#FF6600">Refresh</button>
</div>
<input id="search" placeholder="Search team, league..." oninput="draw()">
<div id="app">Loading...</div>
</div>
