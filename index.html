<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashScore - LIVE 2026 - Europe Time</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
.header{background:#0a2a4a;color:#fff;padding:15px;text-align:center;font-weight:bold;font-size:18px}
.tabs{display:flex;gap:10px;padding:10px;overflow:auto;background:#fff}
.tabs button{border:none;padding:10px 18px;border-radius:20px;font-weight:bold;white-space:nowrap}
.tabs button.active{background:#0a2a4a;color:#fff}
.subtabs{display:flex;gap:8px;padding:8px 10px;overflow:auto;background:#fff;border-top:1px solid #ddd}
.subtabs button{border:1px solid #ccc;background:#fff;padding:6px 14px;border-radius:20px}
.subtabs button.active{background:#0a2a4a;color:#fff;border-color:#0a2a4a}
.filters{display:flex;gap:8px;padding:8px 10px;overflow:auto;background:#fff}
.filters button{border:1px solid #ccc;background:#fff;padding:6px 14px;border-radius:20px}
.filters button.active{background:#0a2a4a;color:#fff}
.match{background:#fff;margin:8px;padding:12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.team{font-weight:bold}
.time{color:#666;font-size:13px}
.score{font-weight:bold;font-size:18px}
.league{font-size:12px;color:#888;margin-bottom:4px}
#error{padding:20px;text-align:center}
</style>
</head>
<body>
<div class="header">FlashScore - LIVE 2026 - Europe Time</div>

<div class="tabs">
<button class="active">FOOTBALL</button>
<button>TENNIS</button>
<button>BASKETBALL</button>
</div>

<div class="subtabs" id="dateTabs">
<button data-date="2026-10-13">13 Oct</button>
<button data-date="2026-10-14">YESTERDAY</button>
<button class="active" data-date="2026-10-15">TODAY 15 OCT</button>
<button data-date="2026-10-16">TOMORROW</button>
</div>

<div class="filters" id="filters">
<button class="active" data-filter="ALL">ALL</button>
<button data-filter="LIVE">LIVE</button>
<button data-filter="FINISHED">FINISHED</button>
<button data-filter="UPCOMING">UPCOMING</button>
</div>

<div id="list"></div>
<div id="error"></div>

<script>
let allMatches = [];
let currentFilter = "ALL";
let currentDate = "2026-10-15";

function safeBerlinTime(m){
  // NEVER CRASH AGAIN - this fixes berlinTime error
  return m?.berlinTime || m?.fixture?.date?.split('T')[1]?.slice(0,5) || m?.time || "15:00";
}
function safeStatus(m){
  return m?.fixture?.status?.short || m?.status || "NS";
}
function safeHome(m){
  return m?.teams?.home?.name || m?.home_team || "Home";
}
function safeAway(m){
  return m?.teams?.away?.name || m?.away_team || "Away";
}
function safeGoals(m){
  let h = m?.goals?.home?? 0;
  let a = m?.goals?.away?? 0;
  return h + " - " + a;
}

async function load(date){
  currentDate = date;
  document.getElementById('list').innerHTML = "<p style='text-align:center'>Loading...</p>";
  try{
    let res = await fetch(`/api/matches?date=${date}`);
    let data = await res.json();
    allMatches = data.response || [];
    render();
  }catch(e){
    document.getElementById('error').innerHTML = "Error: " + e.message;
  }
}

function render(){
  let list = document.getElementById('list');
  list.innerHTML = "";
  let filtered = allMatches.filter(m=>{
    if(currentFilter==="ALL") return true;
    let s = safeStatus(m);
    if(currentFilter==="LIVE") return s==="LIVE" || s==="1H" || s==="2H";
    if(currentFilter==="FINISHED") return s==="FT" || s==="AET" || s==="PEN";
    if(currentFilter==="UPCOMING") return s==="NS" || s==="TBD";
    return true;
  });

  if(filtered.length===0){
    list.innerHTML = `<p style='text-align:center;padding:20px'>No matches for ${currentDate}</p>`;
    return;
  }

  filtered.forEach(m=>{
    let div = document.createElement('div');
    div.className = "match";
    div.innerHTML = `
      <div>
        <div class="league">${m?.league?.name || ""}</div>
        <div class="team">${safeHome(m)}</div>
        <div class="team">${safeAway(m)}</div>
      </div>
      <div style="text-align:right">
        <div class="time">${safeBerlinTime(m)} - ${safeStatus(m)}</div>
        <div class="score">${safeGoals(m)}</div>
      </div>
    `;
    list.appendChild(div);
  });
}

// Date tabs
document.getElementById('dateTabs').addEventListener('click', e=>{
  if(e.target.tagName==="BUTTON"){
    document.querySelectorAll('#dateTabs button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    load(e.target.dataset.date);
  }
});

// Filter tabs
document.getElementById('filters').addEventListener('click', e=>{
  if(e.target.tagName==="BUTTON"){
    document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    render();
  }
});

// Initial load TODAY 15 OCT
load("2026-10-15");
</script>
</body>
</html>
