<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveScore</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial,sans-serif}.header{background:#00ff88;color:#000;text-align:center;padding:15px;font-weight:bold}.dates{display:flex;overflow:auto;gap:8px;padding:10px;background:#111}.dates button{background:#1a1a1a;color:#fff;border:none;padding:10px 15px;border-radius:10px}.dates button.active{background:#00ff88;color:#000}.match{background:#111;margin:10px;padding:12px;border-radius:10px;border-left:4px solid #00ff88}.time{color:#00ff88;font-weight:bold}.no{text-align:center;padding:40px;color:#666}</style></head><body><div class="header">⚽ LiveScore - BLACK & GREEN - Europe/Berlin Time</div><div class="dates" id="dates"></div><div id="list"><div class="no">Loading real matches...</div></div><script>let sel=new Date().toISOString().split('T')[0];function makeDates(){const c=document.getElementById('dates');c.innerHTML='';for(let i=-1;i<=4;i++){const d=new Date();d.setDate(d.getDate()+i);const iso=d.toISOString().split('T')[0];const lbl=i===-1?'YESTERDAY':i===0?'TODAY':i===1?'TOMORROW':d.toLocaleDateString('en-US',{weekday:'short'});const b=document.createElement('button');b.textContent=lbl+' '+iso;if(iso===sel)b.classList.add('active');b.onclick=()=>{sel=iso;document.querySelectorAll('.dates button').forEach(x=>x.classList.remove('active'));b.classList.add('active');load();};c.appendChild(b);}}async function load(){document.getElementById('list').innerHTML='<div class="no">Loading '+sel+'...</div>';try{const r=await fetch('/api/matches?date='+sel);const j=await r.json();const list=j.response||[];if(!list.length){document.getElementById('list').innerHTML='<div class="no">No matches for '+sel+'<br>API found '+j.results+'</div>';return;}document.getElementById('list').innerHTML=list.map(m=>`<div class="match"><div style="font-size:12px;color:#888">${m.league.country} - ${m.league.name} • ${m.fixture.date}</div><div style="display:flex;justify-content:space-between"><div>${m.teams.home.name}<br>${m.teams.away.name}</div><div><div class="time">${m.fixture.berlinTime} ${m.fixture.status.short}</div><div>${m.goals.home??''} - ${m.goals.away??''}</div></div></div></div>`).join('');}catch(e){document.getElementById('list').innerHTML='<div class="no">API Error</div>';}}makeDates();load();</script></body></html>
