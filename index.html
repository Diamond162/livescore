<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveScore Flash</title>
<style>
body{margin:0;background:#0a0e1a;color:#fff;font-family:sans-serif}
header{background:#111827;padding:14px;text-align:center;font-weight:900;font-size:20px;color:#38bdf8;position:sticky;top:0}
#days{display:flex;overflow:auto;gap:8px;padding:10px;background:#0f172a}
.day{padding:8px 14px;border-radius:20px;background:#1e293b;white-space:nowrap;cursor:pointer;font-size:13px}
.day.active{background:#38bdf8;color:#000;font-weight:700}
.match{background:#111827;margin:8px;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.team{font-size:14px}.score{font-weight:900;color:#38bdf8;font-size:18px}
.league{font-size:11px;color:#94a3b8;margin:8px 12px 0}
#loading{text-align:center;padding:40px;color:#94a3b8}
</style>
</head>
<body>
<header>⚡ FlashScore LIVE</header>
<div id="days"></div>
<div id="list"><div id="loading">Loading matches...</div></div>
<script>
const daysEl=document.getElementById('days');
const listEl=document.getElementById('list');
let selected=new Date().toISOString().split('T')[0];
function genDays(){
  for(let i=-3;i<=4;i++){
    let d=new Date();d.setDate(d.getDate()+i);
    let iso=d.toISOString().split('T')[0];
    let el=document.createElement('div');
    el.className='day'+(iso===selected?' active':'');
    el.textContent=(i===0?'Today ':'' )+d.toLocaleDateString('en',{month:'short',day:'numeric'});
    el.onclick=()=>{selected=iso;document.querySelectorAll('.day').forEach(x=>x.classList.remove('active'));el.classList.add('active');load();};
    daysEl.appendChild(el);
  }
}
async function load(){
  listEl.innerHTML='<div id="loading">Loading '+selected+'...</div>';
  try{
    let r=await fetch(`/api/matches?date=${selected}`);
    let j=await r.json();
    let ms=j.matches||[];
    if(ms.length===0){listEl.innerHTML='<div id="loading">No matches for '+selected+'<br><br>API will fill when season active</div>';return;}
    listEl.innerHTML='';
    let by={};ms.forEach(m=>{let l=m.league||m.competition||'Other';(by[l]=by[l]||[]).push(m);});
    for(let l in by){
      let lg=document.createElement('div');lg.className='league';lg.textContent=l;listEl.appendChild(lg);
      by[l].forEach(m=>{
        let div=document.createElement('div');div.className='match';
        div.innerHTML=`<div><div class="team">${m.home_team||m.home||'?'} </div><div class="team">${m.away_team||m.away||'?'}</div></div><div class="score">${m.score||m.status||'vs'}</div>`;
        listEl.appendChild(div);
      });
    }
  }catch(e){listEl.innerHTML='Error: '+e.message;}
}
genDays();load();
setInterval(load,30000);
</script>
</body>
</html>
