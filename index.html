<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashScore 2026 - Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#e8e8e8}
.header{background:#001a33;color:#fff;padding:12px;text-align:center;font-weight:bold;position:sticky;top:0;z-index:10}
.sports{display:flex;gap:8px;padding:8px;background:#fff;overflow-x:auto}
.sports button{padding:6px 14px;border-radius:16px;border:1px solid #ddd;background:#f5f5f5;white-space:nowrap;cursor:pointer}
.sports button.active{background:#001a33;color:#fff;border-color:#001a33}
.dateBar{background:#fff;display:flex;overflow-x:auto;gap:6px;padding:8px;border-bottom:1px solid #ddd}
.dateBar button{padding:6px 10px;border-radius:14px;border:1px solid #eee;background:#f9f9f9;white-space:nowrap;cursor:pointer;font-size:13px}
.dateBar button.active{background:#001a33;color:#fff}
.filters{display:flex;gap:6px;padding:8px;background:#fff;border-bottom:1px solid #ddd}
.filters button{padding:6px 12px;border-radius:14px;border:1px solid #ddd;background:#fff;cursor:pointer}
.filters button.active{background:#001a33;color:#fff}
.leagueHead{background:#f2f2f2;padding:8px 12px;font-size:12px;font-weight:bold;display:flex;justify-content:space-between;border-top:1px solid #ddd;border-bottom:1px solid #ddd}
.match{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#fff;border-bottom:1px solid #eee;cursor:pointer}
.match:hover{background:#f8f9ff}
.left{display:flex;align-items:center;gap:10px;flex:1}
.time{font-size:12px;min-width:45px;color:#333;font-weight:500}
.teams{font-size:14px;line-height:20px;flex:1}
.score{font-weight:bold;color:#d00;min-width:50px;text-align:right}
.liveTag{color:#fff;background:#e00;padding:2px 6px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
<div class="header">FlashScore - LIVE 2026 - Europe Time</div>
<div class="sports" id="sports">
<button class="active">FOOTBALL</button>
<button>TENNIS</button>
<button>BASKETBALL</button>
</div>
<div class="dateBar" id="dateBar"></div>
<div class="filters" id="filters">
<button class="active" data-f="ALL">ALL</button>
<button data-f="LIVE">LIVE</button>
<button data-f="FINISHED">FINISHED</button>
<button data-f="UPCOMING">UPCOMING</button>
</div>
<div id="list">Loading...</div>
<script>
const dateBar=document.getElementById('dateBar');
const listEl=document.getElementById('list');
let currentDate=new Date().toISOString().split('T')[0];
let currentFilter='ALL';
let allData=[];
function initDates(){
  dateBar.innerHTML='';
  for(let i=-2;i<=5;i++){
    let d=new Date(); d.setDate(d.getDate()+i);
    let iso=d.toISOString().split('T')[0];
    let label=i===0?'TODAY '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}).toUpperCase():i===-1?'YESTERDAY':i===1?'TOMORROW':d.toLocaleDateString('en-GB',{month:'short',day:'numeric'});
    let btn=document.createElement('button'); btn.textContent=label;
    if(iso===currentDate) btn.className='active';
    btn.onclick=()=>{currentDate=iso; document.querySelectorAll('#dateBar button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); load();};
    dateBar.appendChild(btn);
  }
}
async function load(){
  listEl.innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';
  try{
    let r=await fetch('/api/matches?date='+currentDate);
    let j=await r.json(); allData=j.response||[]; render();
  }catch(e){ listEl.innerHTML='Error: '+e.message; }
}
function render(){
  let filtered=allData;
  if(currentFilter==='LIVE') filtered=allData.filter(m=>['LIVE','INPLAY','1H','2H','HT'].includes((m.fixture.status.short||'').toUpperCase()));
  else if(currentFilter==='FINISHED') filtered=allData.filter(m=>['FT','FINISHED'].includes((m.fixture.status.short||'').toUpperCase()));
  else if(currentFilter==='UPCOMING') filtered=allData.filter(m=>m.goals.display==='-:-');
  if(!filtered.length){ listEl.innerHTML='<div style="padding:30px;text-align:center">No matches for '+currentDate+'</div>'; return; }
  let byLeague={}; filtered.forEach(m=>{ let key=(m.league.country||'World')+' - '+(m.league.name||'League'); if(!byLeague[key]) byLeague[key]=[]; byLeague[key].push(m); });
  let html='';
  for(let league in byLeague){
    let ms=byLeague[league];
    html+=`<div class="leagueHead"><span>${league}</span><span>${ms.length}</span></div>`;
    ms.forEach(m=>{
      let time=m.fixture.berlinTime||'--:--';
      let isLive=['LIVE','INPLAY','1H','2H','HT'].includes((m.fixture.status.short||'').toUpperCase());
      let score=m.goals.display||'-:-';
      html+=`<div class="match" onclick="location.href='/match.html?id=${m.fixture.id}&date=${currentDate}'">
        <div class="left"><div class="time">${isLive?'<span class=liveTag>LIVE</span>':time}</div><div class="teams"><div>${m.teams.home.name}</div><div>${m.teams.away.name}</div></div></div>
        <div class="score" style="color:${isLive?'#e00':score!=='-:-'?'#111':'#888'}">${score}</div>
      </div>`;
    });
  }
  listEl.innerHTML=html;
}
document.querySelectorAll('#filters button').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentFilter=b.dataset.f; render(); };
});
initDates(); load(); setInterval(load,60000);
function openMatch(id){ location.href='/match.html?id='+id+'&date='+currentDate; }
</script>
</body>
</html>
