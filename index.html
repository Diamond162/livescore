<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flashcore - LiveScore</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
.flash-green{color:#00ff88}
.bg-flash-green{background:#00ff88}
.border-flash-green{border-color:#00ff88}
.match-row:hover{background:#1a1a1a}
.scrollbar-hide::-webkit-scrollbar{display:none}
</style>
</head>
<body class="bg-black">
<!-- FLASHCORE HEADER -->
<header class="bg-[#111] border-b-2 border-[#00ff88] sticky top-0 z-50">
<div class="max-w-[1280px] mx-auto px-3 py-2 flex items-center justify-between">
<div class="flex items-center gap-6">
<div class="text-[22px] font-black"><span class="text-white">FLASH</span><span class="text-[#00ff88]">CORE</span><span class="text-[10px] ml-1 bg-[#00ff88] text-black px-1 rounded">LIVE</span></div>
<nav class="hidden md:flex gap-5 text-[13px] font-bold">
<a class="text-[#00ff88] border-b-2 border-[#00ff88] pb-1">FOOTBALL</a>
<a class="text-gray-400">TENNIS</a>
<a class="text-gray-400">BASKETBALL</a>
</nav>
</div>
<div class="flex items-center gap-3 text-gray-400">
<i class="fa-solid fa-search"></i>
<i class="fa-regular fa-star"></i>
<i class="fa-solid fa-gear"></i>
<div class="w-7 h-7 bg-[#00ff88] rounded-full flex items-center justify-center text-black font-bold text-xs">D</div>
</div>
</div>
</header>

<div class="max-w-[1280px] mx-auto flex">
<!-- LEFT SIDEBAR - like Flashscore -->
<aside class="hidden lg:block w-[220px] bg-[#0f0f0f] min-h-screen p-3 border-r border-[#222]">
<div class="text-[11px] text-gray-500 font-bold mb-2">MY LEAGUES (0)</div>
<div class="text-[11px] text-gray-500 font-bold mt-4 mb-2">TOP LEAGUES</div>
<div class="space-y-1 text-[13px]">
<div class="flex items-center gap-2 p-1.5 hover:bg-[#222] rounded cursor-pointer"><span>🏴󠁧󠁢󠁥󠁮󠁧󠁿</span> Premier League</div>
<div class="flex items-center gap-2 p-1.5 hover:bg-[#222] rounded cursor-pointer"><span>🇪🇸</span> LaLiga</div>
<div class="flex items-center gap-2 p-1.5 hover:bg-[#222] rounded cursor-pointer"><span>🇩🇪</span> Bundesliga</div>
<div class="flex items-center gap-2 p-1.5 hover:bg-[#222] rounded cursor-pointer"><span>🇮🇹</span> Serie A</div>
<div class="flex items-center gap-2 p-1.5 hover:bg-[#222] rounded cursor-pointer"><span>🇫🇷</span> Ligue 1</div>
<div class="flex items-center gap-2 p-1.5 bg-[#00ff88]/10 text-[#00ff88] rounded cursor-pointer"><span>🌍</span> ALL MATCHES</div>
</div>
<div class="mt-4 text-[10px] text-gray-600">Europe/Berlin • Auto refresh 30s</div>
</aside>

<!-- MAIN CONTENT -->
<main class="flex-1 bg-black min-w-0">
<!-- DATE BAR - Flashscore style -->
<div class="bg-[#111] border-b border-[#222] sticky top-[49px] z-40">
<div class="flex overflow-x-auto scrollbar-hide p-2 gap-1" id="dateBar"></div>
<div class="flex gap-2 px-3 pb-2 text-[11px]">
<button class="bg-[#00ff88] text-black px-3 py-1 rounded-full font-bold">ALL</button>
<button class="bg-[#222] text-white px-3 py-1 rounded-full">LIVE</button>
<button class="bg-[#222] text-white px-3 py-1 rounded-full">FINISHED</button>
<button class="bg-[#222] text-white px-3 py-1 rounded-full">SCHEDULED</button>
</div>
</div>

<!-- MATCHES CONTAINER -->
<div id="matches" class="pb-20">
<div class="p-10 text-center text-gray-500">Loading Flashcore...</div>
</div>
</main>

<!-- RIGHT SIDEBAR -->
<aside class="hidden xl:block w-[300px] bg-[#0f0f0f] min-h-screen p-3 border-l border-[#222]">
<div class="text-[11px] text-gray-500 font-bold mb-2">FEATURED</div>
<div class="bg-[#1a1a1a] p-3 rounded text-xs">Your 500 credits • live-football-api.com<br><span class="text-[#00ff88] font-bold">BLACK & GREEN EDITION</span></div>
</aside>
</div>

<script>
let selectedDate = new Date().toISOString().split('T')[0];
function buildDates(){
const bar=document.getElementById('dateBar'); bar.innerHTML='';
for(let i=-4;i<=4;i++){
let d=new Date(); d.setDate(d.getDate()+i);
let iso=d.toISOString().split('T')[0];
let dayName=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
let dayNum=d.getDate();
let isToday=i===0;
let btn=document.createElement('button');
btn.className=`min-w-[68px] py-1.5 rounded text-[11px] font-bold border ${iso===selectedDate?'bg-[#00ff88] text-black border-[#00ff88]':'bg-[#1e1e1e] text-gray-300 border-[#333] hover:bg-[#2a2a2a]'}`;
btn.innerHTML=`<div class="text-[10px]">${dayName}</div><div class="text-[13px]">${isToday?'TODAY':dayNum} ${isToday?dayNum:''}</div>`;
if(isToday) btn.innerHTML=`<div class="text-[10px]">TODAY</div><div>${dayName} ${dayNum}</div>`;
btn.onclick=()=>{selectedDate=iso; document.querySelectorAll('#dateBar button').forEach(b=>b.className='min-w-[68px] py-1.5 rounded text-[11px] font-bold border bg-[#1e1e1e] text-gray-300 border-[#333]'); btn.className='min-w-[68px] py-1.5 rounded text-[11px] font-bold border bg-[#00ff88] text-black border-[#00ff88]'; loadMatches();};
bar.appendChild(btn);
}
}
async function loadMatches(){
const container=document.getElementById('matches');
container.innerHTML=`<div class="p-10 text-center"><div class="text-[#00ff88] animate-pulse">Loading ${selectedDate}...</div></div>`;
try{
let res=await fetch(`/api/matches?date=${selectedDate}`);
let data=await res.json();
let matches=data.response||[];
if(!matches.length){container.innerHTML=`<div class="p-10 text-center text-gray-500">No matches on ${selectedDate}<br><span class="text-xs">${data.error||'Try another date'}</span></div>`; return;}
// Group by league like Flashscore
let groups={};
matches.forEach(m=>{
let leagueKey=m.league.name||'Other';
if(!groups[leagueKey]) groups[leagueKey]=[];
groups[leagueKey].push(m);
});
let html='';
Object.keys(groups).forEach(leagueName=>{
let leagueMatches=groups[leagueName];
html+=`<div class="bg-[#1a1a1a] mt-2"><div class="flex items-center gap-2 px-3 py-2 text-[12px] font-bold bg-[#222] border-l-4 border-[#00ff88]"><span class="text-[#00ff88]">⚽</span> ${leagueName} <span class="ml-auto text-gray-500 text-[10px]">${leagueMatches[0].league.country||''}</span></div>`;
leagueMatches.forEach(m=>{
let time=m.fixture.berlinTime||'--:--';
let status=m.fixture.status.short||'NS';
let isLive=['1H','2H','LIVE','HT','ET'].includes(status.toUpperCase());
let minute=m.fixture.minute||'';
let home=m.teams.home.name; let away=m.teams.away.name;
let gh=m.goals.home; let ga=m.goals.away;
let score = (gh!==null && ga!==null)? `${gh} - ${ga}` : '- : -';
html+=`
<div class="match-row flex items-center px-3 py-2.5 border-b border-[#222] text-[13px] cursor-pointer">
<div class="w-[52px] text-[11px] ${isLive?'text-red-500 font-bold':'text-gray-400'}">${isLive?`${minute}'`:time}<br><span class="text-[9px]">${isLive?status:''}</span></div>
<div class="flex-1">
<div class="flex justify-between"><span class="${gh>ga?'font-bold text-white':''}">${home}</span><span class="font-bold ${isLive?'text-[#00ff88]':''}">${gh!==null?gh:''}</span></div>
<div class="flex justify-between text-gray-400"><span class="${ga>gh?'font-bold text-white':''}">${away}</span><span class="font-bold ${isLive?'text-[#00ff88]':''}">${ga!==null?ga:''}</span></div>
</div>
<div class="w-[40px] text-right text-gray-500"><i class="fa-regular fa-star text-[12px]"></i></div>
</div>`;
});
html+=`</div>`;
});
container.innerHTML=html;
}catch(e){
