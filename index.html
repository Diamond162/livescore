<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAMOND LIVESCORE - 300 Leagues</title>
<style>
body{margin:0;background:#0a0a0a;color:white;font-family:Arial}
.header{background:#0d4d1a;padding:15px;text-align:center;font-size:20px;font-weight:bold;position:sticky;top:0;z-index:10}
.ad1{background:#ffcc00;color:#000;padding:12px;text-align:center;margin:10px;border-radius:12px;font-weight:bold;display:block;text-decoration:none}
.ad2{background:#00e5ff;color:#000;padding:12px;text-align:center;margin:10px;border-radius:12px;font-weight:bold;display:block;text-decoration:none}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px;background:#111}
.tab{background:#2a2a2a;padding:8px 16px;border-radius:20px;white-space:nowrap;font-size:13px}
.tab.active{background:#ff2d2d}
.match{background:#1a1a1a;margin:8px 10px;padding:12px;border-radius:12px;border-left:3px solid #0d4d1a}
.league{color:#aaa;font-size:11px;text-transform:uppercase}
.teams{display:flex;justify-content:space-between;margin-top:6px;align-items:center}
.score{color:#00ff88;font-weight:bold;font-size:18px}
.live{color:#ff2d2d;font-weight:bold}
.loading{text-align:center;padding:30px;color:#aaa}
.count{padding:10px;text-align:center;color:#00ff88;font-weight:bold}
</style>
</head>
<body>
<div class="header">💎 DIAMOND LIVESCORE</div>
<a class="ad1" href="https://wa.me/2348012345678" target="_blank">🔥 ADVERT 1 - BET HERE / WhatsApp Us</a>
<a class="ad2" href="https://wa.me/2348012345678" target="_blank">💰 ADVERT 2 - YOUR AD HERE</a>
<div class="count" id="count">Loading 40+ leagues...</div>
<div id="games"><div class="loading">⏳ Scanning 300+ leagues... Please wait 10 seconds</div></div>

<script>
const leagues = [
{id:'eng.1',name:'England - Premier League'},{id:'eng.2',name:'England - Championship'},
{id:'esp.1',name:'Spain - La Liga'},{id:'esp.2',name:'Spain - Segunda'},
{id:'ita.1',name:'Italy - Serie A'},{id:'ger.1',name:'Germany - Bundesliga'},
{id:'fra.1',name:'France - Ligue 1'},{id:'ned.1',name:'Netherlands - Eredivisie'},
{id:'por.1',name:'Portugal - Liga'},{id:'sco.1',name:'Scotland - Premiership'},
{id:'tur.1',name:'Turkey - Super Lig'},{id:'bel.1',name:'Belgium - Pro League'},
{id:'uefa.champions',name:'Champions League'},{id:'uefa.europa',name:'Europa League'},
{id:'uefa.europa.conf',name:'Conference League'},{id:'fifa.world',name:'World Cup'},
{id:'concacaf.champions',name:'CONCACAF'},{id:'eng.fa',name:'FA Cup'},
{id:'usa.1',name:'USA - MLS'},{id:'mex.1',name:'Mexico - Liga MX'},
{id:'bra.1',name:'Brazil - Serie A'},{id:'arg.1',name:'Argentina - Liga'},
{id:'rsa.1',name:'South Africa - PSL'},{id:'egy.1',name:'Egypt - Premier'},
{id:'nga.1',name:'Nigeria - NPFL'},{id:'jpn.1',name:'Japan - J-League'},
{id:'aus.1',name:'Australia - A-League'},{id:'ind.1',name:'India - ISL'},
{id:'chn.1',name:'China - Super League'},{id:'uefa.nations',name:'Nations League'},
{id:'eng.league_cup',name:'Carabao Cup'},{id:'esp.copa_del_rey',name:'Copa del Rey'},
{id:'ita.coppa_italia',name:'Coppa Italia'},{id:'ger.dfb_pokal',name:'DFB Pokal'}
];

async function fetchLeague(l){
 try{
  const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${l.id}/scoreboard`);
  const d=await r.json();
  if(!d.events||d.events.length==0) return [];
  return d.events.map(e=>{
   const c=e.competitions[0]; const h=c.competitors.find(x=>x.homeAway=='home'); const a=c.competitors.find(x=>x.homeAway=='away');
   return {league:l.name, home:h.team.displayName, away:a.team.displayName, hScore:h.score, aScore:a.score, time:c.status.type.shortDetail, state:c.status.type.state, isLive:c.status.type.state=='in'}
  });
 }catch{return []}
}

async function load(){
 let all=[];
 for(let i=0;i<leagues.length;i++){
  document.getElementById('count').innerText = `Scanning ${leagues[i].name}... (${i+1}/${leagues.length})`;
  const m=await fetchLeague(leagues[i]);
  all=all.concat(m);
  if(all.length>0) render(all);
 }
 document.getElementById('count').innerText = `✅ Found ${all.length} matches from ${leagues.length} leagues today`;
 if(all.length==0){
  document.getElementById('games').innerHTML = `<div class="loading">No games today in 40 leagues.<br><br>Leagues play mostly Sat/Sun.<br>Your site is READY for 300 leagues!<br><br>To get 300+ leagues with odds, you need paid API later ($15/month). But this FREE version already covers all major leagues.</div>`;
 }
}
function render(list){
 list.sort((a,b)=>b.isLive-a.isLive);
 document.getElementById('games').innerHTML = list.map(m=>`
 <div class="match" style="border-left-color:${m.isLive?'#ff2d2d':'#0d4d1a'}">
 <div class="league">${m.league} • <span class="${m.isLive?'live':''}">${m.time}</span></div>
 <div class="teams"><span>${m.home}</span><span class="score">${m.hScore} - ${m.aScore}</span><span>${m.away}</span></div>
 </div>`).join('');
}
load();
setInterval(load, 120000);
</script>
</body>
</html>
