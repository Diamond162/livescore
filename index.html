<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Diamond Livescore</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;font-size:13px}
.header{background:#001e28;padding:12px 10px;position:sticky;top:0;z-index:10;border-bottom:2px solid #00b8d6}
.search-box{padding:8px;background:#0a0a0a}
.search-box input{width:100%;background:#222;border:1px solid #333;border-radius:6px;padding:10px;color:#fff;outline:none}
.tabs{display:flex;gap:6px;padding:8px;background:#111;overflow:auto}
.tab{padding:6px 14px;border-radius:15px;background:#222;color:#aaa;font-size:12px;white-space:nowrap;cursor:pointer}
.tab.active{background:#00b8d6;color:#fff}
.country-head{background:#1c1c1c;color:#fff;padding:7px 10px;font-weight:bold;font-size:12px;display:flex;justify-content:space-between;text-transform:uppercase;border-top:1px solid #333}
.country-head span:last-child{color:#00b8d6;font-weight:400}
.match-row{display:flex;align-items:center;padding:10px;background:#000;border-bottom:1px solid #1a1a1a}
.score{width:70px;text-align:right;font-weight:bold}
.score.live{color:#ff2b2b}
.score.ft{color:#fff}
.score.up{color:#666}
.live-dot{width:6px;height:6px;background:red;border-radius:50%;display:inline-block;margin-right:4px;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0.2}100%{opacity:1}}
.time{width:60px;color:#888;font-size:11px}
.teams{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
</style>
</head>
<body>
<div class="header"><div style="display:flex;justify-content:space-between;align-items:center"><h1>💎 DIAMOND LIVESCORE</h1><small id="count" style="color:#aaa"></small></div></div>
<div class="search-box"><input id="search" placeholder="Search country, league, team..." oninput="render()"></div>
<div class="tabs">
<div class="tab active" data-f="all" onclick="setFilter('all')">All</div>
<div class="tab" data-f="live" onclick="setFilter('live')">🔴 Live</div>
<div class="tab" data-f="finished" onclick="setFilter('finished')">Finished</div>
<div class="tab" data-f="upcoming" onclick="setFilter('upcoming')">Upcoming</div>
</div>
<div id="app"><div style="padding:30px;text-align:center;color:#666">Loading matches...</div></div>
<script>

  {fixture:{id:2,date:new Date().toISOString(),time:"18:45",status:{short:"FT",display:"FT"}},league:{name:"La Liga",country:"SPAIN"},teams:{home:{name:"Barcelona"},away:{name:"Real Madrid"}},goals:{home:1,away:1}},

  {fixture:{id:4,date:new Date().toISOString(),time:"20:00",status:{short:"FT",display:"FT"}},league:{name:"Bundesliga",country:"GERMANY"},teams:{home:{name:"Bayern Munich"},away:{name:"Dortmund"}},goals:{home:3,away:0}},
  {fixture:{id:5,date:new Date().toISOString(),time:"19:00",status:{short:"LIVE",display:"78'"}},league:{name:"Ligue 1",country:"FRANCE"},teams:{home:{name:"PSG"},away:{name:"Marseille"}},goals:{home:2,away:2}},
  {fixture:{id:6,date:new Date().toISOString(),time:"22:00",status:{short:"UPCOMING",display:"22:00"}},league:{name:"Brasileiro",country:"BRAZIL"},teams:{home:{name:"RB Bragantino"},away:{name:"Cruzeiro"}},goals:{home:null,away:null}},
];
async function load(){
  try{
    const r = await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard');
    const data = await r.json();
    let events = data.events || [];
    if(events.length>0){
      all = events.map(ev=>{
        const comp=ev.competitions[0];
        const home=comp.competitors.find(c=>c.homeAway==='home');
        const away=comp.competitors.find(c=>c.homeAway==='away');
        let s='UPCOMING';
        if(comp.status.type.name==='STATUS_IN_PROGRESS') s='LIVE';
        else if(comp.status.type.name==='STATUS_FINAL') s='FT';
        let hg=null,ag=null;
        if(s!=='UPCOMING'){ hg=parseInt(home.score)||0; ag=parseInt(away.score)||0; }
        const t=new Date(ev.date).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        return {fixture:{id:ev.id,date:ev.date,time:t,status:{short:s,display:comp.status.type.shortDetail||s}},league:{name:ev.leagues?.[0]?.name||'Football',country:ev.leagues?.[0]?.country||'WORLD'},teams:{home:{name:home.team.displayName},away:{name:away.team.displayName}},goals:{home:hg,away:ag}};
      });
    }else{ all=SAMPLE; }
  }catch(e){ all=SAMPLE; }
  document.getElementById('count').textContent=all.length+' matches';
  render();
}
